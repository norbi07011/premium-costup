<script>
(function(){
const NLD={"PMMA coatings": "PMMA-coatings", "Rapid-cure waterproofing": "Snelhardende waterdichting", "Methyl methacrylate cures in about an hour, even in cold weather. Ideal for balconies, galleries and ramps where residents cannot wait.": "Methylmethacrylaat hardt uit in ongeveer een uur, ook bij koud weer. Ideaal voor balkons, galerijen en hellingbanen waar bewoners niet kunnen wachten.", "PMMA is a liquid waterproofing membrane and a wearing floor in one. It cures in about 60 minutes, resists UV and standing water, and with a fleece reinforcement it bridges cracks in the concrete. It is our standard for balconies, galleries (galerijen) and terraces on VvE projects.": "PMMA is een vloeibare waterdichting en een slijtvaste vloer in één. Het hardt uit in ongeveer 60 minuten, is bestand tegen UV en staand water en overbrugt met een vliesversterking scheuren in het beton. Het is onze standaard voor balkons, galerijen en terrassen bij VvE-projecten.", "Because PMMA cures chemically rather than by evaporation, we can work at substrate temperatures from around 0 °C. Layers go on the same day, so a 40 m gallery is often finished in one or two working days, in sections, so residents always keep access to their front door.": "Omdat PMMA chemisch uithardt en niet door verdamping, kunnen we werken bij een ondergrondtemperatuur vanaf circa 0 °C. Alle lagen gaan dezelfde dag op, dus een galerij van 40 m is vaak in één tot twee werkdagen klaar, in secties, zodat bewoners altijd bij hun voordeur kunnen.", "We finish with a coloured-quartz or flake broadcast and a slip class chosen for the location: R10 on covered galleries, R11–R12 on open balconies and ramps. Details at thresholds, drains and balustrade posts are done in the same material, without joints.": "We werken af met ingestrooid gekleurd kwarts of flakes en een slipklasse die past bij de plek: R10 op overdekte galerijen, R11–R12 op open balkons en hellingbanen. Details bij dorpels, afvoeren en balusterstaanders maken we naadloos in hetzelfde materiaal.", "System thickness": "Systeemdikte", "Cure (20 °C)": "Uitharding (20 °C)", "approx. 60 min": "ca. 60 min", "Foot traffic": "Beloopbaar", "after approx. 2 h": "na ca. 2 uur", "Application temp.": "Verwerkingstemp.", "from approx. 0 °C (substrate)": "vanaf ca. 0 °C (ondergrond)", "UV resistance": "UV-bestendigheid", "yes, non-yellowing": "ja, vergeelt niet", "Crack bridging": "Scheuroverbruggend", "yes (with fleece)": "ja (met vlies)", "Slip resistance": "Slipweerstand", "Balconies and loggias": "Balkons en loggia's", "Galleries and outdoor stairwells (VvE)": "Galerijen en buitentrappenhuizen (VvE)", "Terraces over living space": "Terrassen boven woonruimte", "Ramps and driveways": "Hellingbanen en opritten", "Repairs in low temperatures": "Herstel bij lage temperaturen", "PMMA topcoat, matte": "PMMA-toplaag, mat", "Quartz / flake broadcast": "Kwarts- / flake-instrooiing", "PMMA membrane + fleece": "PMMA-membraan + vlies", "PMMA primer": "PMMA-primer", "Concrete (ground)": "Beton (geschuurd)", "Epoxy floors": "Epoxyvloeren", "Hardness and chemical resistance": "Hardheid en chemische bestendigheid", "Self-levelling or roller-applied epoxy systems for halls, warehouses, workshops and showrooms. Seamless and easy to maintain.": "Zelfnivellerende of gerolde epoxysystemen voor hallen, magazijnen, werkplaatsen en showrooms. Naadloos en onderhoudsvriendelijk.", "Epoxy resin gives a very hard, sealed and chemically resistant surface. We apply it as a rolled coating (0.3–0.5 mm), a quartz-broadcast system or a 2–3 mm self-levelling floor, classified to NEN-EN 13813 as SR.": "Epoxyhars geeft een zeer hard, gesloten en chemisch bestendig oppervlak. We brengen het aan als gerolde coating (0,3–0,5 mm), als ingestrooid kwartssysteem of als zelfnivellerende gietvloer van 2–3 mm, geclassificeerd volgens NEN-EN 13813 als SR.", "Epoxy performs best indoors. Outdoors, and wherever daylight reaches the floor, we seal it with a UV-stable polyurethane topcoat, because epoxy alone yellows over time. Colours come from the RAL range; the floor can get decorative flakes, safety lines and zone markings.": "Epoxy presteert het best binnen. Buiten, en overal waar daglicht op de vloer valt, sluiten we af met een UV-bestendige polyurethaan toplaag, omdat epoxy alleen na verloop van tijd vergeelt. Kleuren kiest u uit het RAL-palet; de vloer kan decoratieve flakes, veiligheidslijnen en zonemarkering krijgen.", "Before pouring we measure concrete moisture by the CM method (max. approx. 4 % for cementitious substrates), pull-off strength (min. 1.5 N/mm²) and the dew point. We do not give a warranty without these measurements, because they decide adhesion.": "Voordat we gieten meten we het vochtgehalte van het beton met de CM-methode (max. ca. 4 % bij cementgebonden ondergronden), de hechttreksterkte (min. 1,5 N/mm²) en het dauwpunt. Zonder deze metingen geven we geen garantie, want zij bepalen de hechting.", "Thickness": "Dikte", "Classification": "Classificatie", "after approx. 24 h": "na ca. 24 uur", "Full load": "Volledig belastbaar", "after approx. 7 days": "na ca. 7 dagen", "Chemical resistance": "Chemische bestendigheid", "very high": "zeer hoog", "needs PU topcoat": "PU-toplaag nodig", "Warehouses and logistics centres": "Magazijnen en distributiecentra", "Production halls": "Productiehallen", "Workshops and garages": "Werkplaatsen en garages", "Showrooms": "Showrooms", "Technical corridors": "Technische gangen", "Sealer coat": "Sealerlaag", "Self-levelling EP layer": "Zelfnivellerende EP-laag", "EP primer + quartz broadcast": "EP-primer + kwartsinstrooiing", "Concrete (diamond ground)": "Beton (diamantgeschuurd)", "Polyurethane systems": "Polyurethaansystemen", "Elasticity and UV stability": "Elasticiteit en UV-bestendigheid", "Elastic, crack-bridging PU coatings for car parks, ramps and balconies, and PU-cement for the food industry.": "Elastische, scheuroverbruggende PU-coatings voor parkeergarages, hellingbanen en balkons, en PU-cement voor de voedingsindustrie.", "Polyurethane moves with the concrete. Where the structure deflects, and where road salt and sunlight act on it, an elastic PU system protects the reinforcement from water and chlorides. We use it on parking decks, ramps and trafficable roofs.": "Polyurethaan beweegt mee met het beton. Waar de constructie doorbuigt en waar strooizout en zonlicht inwerken, beschermt een elastisch PU-systeem de wapening tegen water en chloriden. We passen het toe op parkeerdekken, hellingbanen en beloopbare daken.", "For car parks we build a multi-layer system: epoxy primer, elastic PU membrane, wearing layer with coarse quartz and a UV-stable topcoat. These systems protect concrete in line with NEN-EN 1504-2 and resist tyre marks, oil and salt.": "Voor parkeergarages bouwen we een meerlaags systeem op: epoxyprimer, elastisch PU-membraan, slijtlaag met grof kwarts en een UV-bestendige toplaag. Deze systemen beschermen beton volgens NEN-EN 1504-2 en zijn bestand tegen bandensporen, olie en zout.", "In commercial kitchens and food plants we use PU-cement: 6–9 mm, resistant to thermal shock from hot-water and steam cleaning, to fats and organic acids. We combine it with a coved skirting (holle plint) to meet HACCP requirements.": "In grootkeukens en voedingsbedrijven passen we PU-cement toe: 6–9 mm, bestand tegen thermische schokken bij reiniging met heet water en stoom, tegen vetten en organische zuren. We combineren het met een holle plint, zodat aan de HACCP-eisen wordt voldaan.", "2–4 mm (PU-cement 6–9 mm)": "2–4 mm (PU-cement 6–9 mm)", "yes, elastic system": "ja, elastisch systeem", "yes (aliphatic topcoat)": "ja (alifatische toplaag)", "Vehicle traffic": "Berijdbaar", "after approx. 3–5 days": "na ca. 3–5 dagen", "Concrete protection": "Betonbescherming", "Parking decks and garages": "Parkeerdekken en garages", "Access ramps": "Hellingbanen", "Trafficable roofs and terraces": "Beloopbare daken en terrassen", "Commercial kitchens (PU-cement)": "Grootkeukens (PU-cement)", "Food processing plants": "Voedselverwerkende bedrijven", "UV-stable PU topcoat": "UV-bestendige PU-toplaag", "Wearing layer + coarse quartz": "Slijtlaag + grof kwarts", "Elastic PU membrane": "Elastisch PU-membraan", "EP primer": "EP-primer", "Concrete (shot-blasted)": "Beton (gestraald)", "Troffelvloer": "Troffelvloer", "Trowelled epoxy-quartz screed": "Getroffelde epoxy-kwartsvloer", "The toughest system: 4–8 mm of epoxy-quartz mortar, power-trowelled. For commercial kitchens, production and heavy-duty areas.": "Het zwaarste systeem: 4–8 mm epoxy-kwartsmortel, machinaal getroffeld. Voor grootkeukens, productie en zwaarbelaste ruimtes.", "A troffelvloer is a mortar of epoxy resin and kiln-dried quartz sand, laid 4–8 mm thick and finished with a hand or power trowel. The result is a floor with very high compressive and impact strength, sealed with a closed topcoat.": "Een troffelvloer is een mortel van epoxyhars en gedroogd kwartszand, aangebracht in 4–8 mm en afgewerkt met de hand- of machinetroffel. Het resultaat is een vloer met een zeer hoge druk- en slagvastheid, afgesloten met een dichte toplaag.", "This system is the choice for commercial kitchens, bakeries, meat processing, workshops and halls with forklift traffic. The quartz texture gives R11–R13 slip resistance even on a wet, greasy floor, and the sealer makes daily cleaning easy.": "Dit systeem is de keuze voor grootkeukens, bakkerijen, vleesverwerking, werkplaatsen en hallen met heftruckverkeer. De kwartsstructuur geeft slipklasse R11–R13, ook op een natte, vette vloer, en de sealer maakt dagelijkse reiniging eenvoudig.", "A troffelvloer also lets us form falls to drains and channel gutters without an extra screed. We form coved skirtings (holle plint) from the same mortar, as in the photos from our kitchen project.": "Met een troffelvloer kunnen we ook afschot naar putten en goten maken zonder extra dekvloer. Holle plinten zetten we in dezelfde mortel, zoals op de foto's van ons keukenproject.", "Composition": "Samenstelling", "EP resin + quartz sand": "EP-hars + kwartszand", "Compressive strength": "Druksterkte", "very high (> 60 N/mm², per system)": "zeer hoog (> 60 N/mm², per systeem)", "after approx. 24–48 h": "na ca. 24–48 uur", "Falls to drains": "Afschot naar putten", "yes, in one layer": "ja, in één laag", "Hygiene": "Hygiëne", "seamless, coved skirting, HACCP": "naadloos, holle plint, HACCP", "Commercial kitchens and catering": "Grootkeukens en horeca", "Food production": "Voedselproductie", "Halls with forklift traffic": "Hallen met heftruckverkeer", "Workshops and wash bays": "Werkplaatsen en wasplaatsen", "Wet rooms": "Natte ruimtes", "EP pore sealer": "EP-poriënsealer", "EP + quartz mortar, trowelled": "EP + kwartsmortel, getroffeld", "Concrete (blasted / milled)": "Beton (gestraald / gefreesd)", "Large-format surfaces": "Grote oppervlakken", "Halls · warehouses · kitchens": "Hallen · magazijnen · keukens", "End to end: from grinding and substrate preparation to a finished floor across thousands of m².": "Compleet: van schuren en voorbereiden van de ondergrond tot een afgewerkte vloer over duizenden m².", "A large project is won in substrate preparation. We diamond-grind, shot-blast or mill the concrete, remove old coatings and repair cracks and voids before the system goes down. Always with dust extraction.": "Een groot project wordt gewonnen in de voorbereiding. We schuren het beton met diamant, stralen of frezen het, verwijderen oude coatings en herstellen scheuren en gaten voordat het systeem erop gaat. Altijd met stofafzuiging.", "We work in live buildings: we split the hall into phases, agree night and weekend work windows with the facility manager and hand over zone by zone. Every phase has a record: CM moisture, pull-off strength, temperature and dew point, layer thickness.": "We werken in panden die in gebruik zijn: we delen de hal op in fases, spreken met de facilitair manager nacht- en weekendvensters af en leveren zone voor zone op. Elke fase krijgt een verslag: CM-vocht, hechttreksterkte, temperatuur en dauwpunt, laagdikte.", "We match the system to the load: self-levelling epoxy for warehouses, troffelvloer for kitchens and production, PU-cement where there is hot water and chemicals. We also detail movement joints, safety lines and traffic-route marking.": "We stemmen het systeem af op de belasting: zelfnivellerende epoxy voor magazijnen, troffelvloer voor keukens en productie, PU-cement waar heet water en chemicaliën zijn. Ook dilatatievoegen, veiligheidslijnen en looproutemarkering werken we uit.", "Diamond grinding and shot blasting with dust extraction": "Diamantschuren en kogelstralen met stofafzuiging", "Repair of cracks, voids and joints": "Herstel van scheuren, gaten en voegen", "CM, pull-off and dew-point measurement with a record": "CM-, hechttrek- en dauwpuntmeting met verslag", "Phasing in live buildings": "Gefaseerd werken in panden in gebruik", "Safety lines and zone marking": "Veiligheidslijnen en zonemarkering", "Balconies, terraces and galleries": "Balkons, terrassen en galerijen", "Residential · VvE": "Woningbouw · VvE", "Watertight, slip-resistant PMMA coatings for balconies and galleries. Fast, clean, without long closures.": "Waterdichte, slipvaste PMMA-coatings voor balkons en galerijen. Snel, schoon en zonder lange afsluiting.", "Balconies and galleries in the Netherlands work in rain, frost and sun. Leaks into the flats below and corroded reinforcement are the most common problems VvEs and property managers bring to us. We solve them with seamless PMMA waterproofing finished with coloured quartz.": "Balkons en galerijen in Nederland staan in regen, vorst en zon. Lekkage naar de woningen eronder en gecorrodeerde wapening zijn de meest voorkomende problemen waarmee VvE's en beheerders bij ons komen. We lossen ze op met naadloze PMMA-waterdichting, afgewerkt met gekleurd kwarts.", "On galleries we work in sections and always leave a walkway to front doors. Residents receive a letter with the schedule in advance. PMMA cures in an hour, so even in autumn weather we close a section the same day.": "Op galerijen werken we in secties en laten we altijd een looppad naar de voordeuren vrij. Bewoners krijgen vooraf een brief met de planning. PMMA hardt in een uur uit, dus zelfs bij herfstweer sluiten we een sectie dezelfde dag af.", "Details decide watertightness: balcony door thresholds, balustrade posts, drains, gutters and slab edges. We form them in the same system, reinforced with fleece. Colour separation lines are taped and cut precisely, as in the photos of our projects.": "Details bepalen de waterdichtheid: dorpels van balkondeuren, balusterstaanders, afvoeren, goten en plaatranden. We maken ze in hetzelfde systeem, versterkt met vlies. Kleurscheidingslijnen worden strak afgeplakt en gesneden, zoals op de foto's van onze projecten.", "PMMA waterproofing with fleece": "PMMA-waterdichting met vlies", "Coloured-quartz or flake finish": "Afwerking met gekleurd kwarts of flakes", "Slip resistance R10–R12": "Slipweerstand R10–R12", "Sectional work with door access": "Werken in secties met toegang tot de deur", "Schedule and resident notices": "Planning en bewonersbrieven", "Garages and car parks": "Garages en parkeergarages", "Garages · ramps · car parks": "Garages · hellingbanen · parkeergarages", "Resistant to salt, oil and tyre marks. From a private garage to a multi-storey car park and outdoor ramp.": "Bestand tegen zout, olie en bandensporen. Van een privégarage tot een parkeergarage met meerdere lagen en een buitenhellingbaan.", "Road salt carried in on tyres is the biggest enemy of garage concrete. Chlorides penetrate and corrode the reinforcement. A sealed coating stops them at the surface and protects the structure for years.": "Strooizout dat via de banden binnenkomt is de grootste vijand van garagebeton. Chloriden dringen het beton in en tasten de wapening aan. Een gesloten coating houdt ze aan het oppervlak tegen en beschermt de constructie jarenlang.", "In underground garages we use epoxy systems with quartz broadcast; on open-air decks and ramps, elastic UV-stable PU or PMMA systems. Ramps receive coarser quartz for tyre grip, also in rain.": "In ondergrondse garages gebruiken we epoxysystemen met kwartsinstrooiing; op open parkeerdekken en hellingbanen elastische, UV-bestendige PU- of PMMA-systemen. Hellingbanen krijgen grover kwarts voor grip, ook bij regen.", "We finish with markings: bay lines, direction arrows, pedestrian crossings and protective kerbs, as on the ramp in our project. For private garages we recommend flake epoxy, which looks good and does not absorb oil.": "We werken af met markering: vakbelijning, richtingspijlen, voetgangersoversteken en schrikranden, zoals op de hellingbaan van ons project. Voor privégarages adviseren we epoxy met flakes: dat oogt goed en neemt geen olie op.", "Protection against chlorides and road salt": "Bescherming tegen chloriden en strooizout", "Elastic systems for decks and ramps": "Elastische systemen voor dekken en hellingbanen", "Coarse quartz on ramps (R12–R13)": "Grof kwarts op hellingbanen (R12–R13)", "Lines, arrows and markings": "Belijning, pijlen en markering", "Private garages with flakes": "Privégarages met flakes", "Balcony, PMMA with coloured quartz": "Balkon, PMMA met gekleurd kwarts", "Gallery in progress, colour line": "Galerij in uitvoering, kleurlijn", "Commercial kitchen, troffelvloer": "Grootkeuken, troffelvloer", "Residential gallery after renovation": "Woongalerij na renovatie", "Car park ramp with kerb": "Hellingbaan parkeergarage met schrikrand", "Flakes and coved skirting": "Flakes en holle plint", "Balcony, slip-resistant coating": "Balkon, slipvaste coating", "Garage entrance, markings": "Garage-inrit, markering", "Gallery at front doors": "Galerij bij de voordeuren", "Technical corridor, epoxy": "Technische gang, epoxy", "Inspection & measurement": "Inspectie & meting", "We visit the site, assess the concrete and take measurements. On that basis we prepare a quotation with the chosen system.": "We komen langs, beoordelen het beton en voeren metingen uit. Op basis daarvan maken we een offerte met het gekozen systeem.", "CM moisture": "CM-vocht", "dew point": "dauwpunt", "Substrate preparation": "Voorbereiding ondergrond", "Diamond grinding, shot blasting or milling to an open, sound surface.": "Diamantschuren, kogelstralen of frezen tot een open, draagkrachtig oppervlak.", "old coating removal": "verwijderen oude coatings", "dust extraction": "stofafzuiging", "Repair & primer": "Herstel & primer", "We fill cracks and voids, level and apply a primer matched to the system.": "We vullen scheuren en gaten, egaliseren en brengen een primer aan die past bij het systeem.", "cracks, joints": "scheuren, voegen", "primer + broadcast": "primer + instrooiing", "System application": "Aanbrengen systeem", "We pour and spread base layers, broadcast and topcoat, checking thickness as we go.": "We gieten en verdelen de basislagen, de instrooiing en de toplaag en controleren de laagdikte tijdens het werk.", "thickness control": "laagdiktecontrole", "temp. +3 K above dew point": "temp. +3 K boven dauwpunt", "Handover & warranty": "Oplevering & garantie", "Final check, handover record, maintenance guide and written warranty terms.": "Eindcontrole, opleverrapport, onderhoudsadvies en schriftelijke garantievoorwaarden.", "handover report (opleverrapport)": "opleverrapport", "maintenance advice": "onderhoudsadvies", "Synthetic resin screeds": "Kunstharsgebonden vloeren", "Classification of synthetic resin floors (SR) for bond strength, wear and impact resistance. We describe the performance of our epoxy and troffelvloer systems to this standard.": "Classificatie van kunstharsvloeren (SR) op hechtsterkte, slijtvastheid en slagvastheid. Volgens deze norm beschrijven we de prestaties van onze epoxy- en troffelvloersystemen.", "Surface protection of concrete": "Oppervlaktebescherming van beton", "The standard for systems protecting concrete against water, chlorides and CO₂. It applies to coatings on car parks, balconies and galleries.": "De norm voor systemen die beton beschermen tegen water, chloriden en CO₂. Van toepassing op coatings in parkeergarages, op balkons en galerijen.", "Liquid-applied waterproofing": "Vloeibaar aangebrachte waterdichting", "European technical assessment for liquid membranes such as PMMA on balconies and terraces. We use systems that carry such an approval.": "Europese technische beoordeling voor vloeibare membranen zoals PMMA op balkons en terrassen. We werken met systemen die zo'n goedkeuring hebben.", "Classes R9–R13 describe slip resistance in footwear. We match the class to the zone: kitchen, ramp, balcony, warehouse.": "De klassen R9–R13 beschrijven de slipweerstand met schoeisel. We kiezen de klasse per zone: keuken, hellingbaan, balkon, magazijn.", "Besluit bouwwerken leefomgeving": "Besluit bouwwerken leefomgeving", "Replaced the Bouwbesluit in 2024. We take its safety-in-use requirements into account, for example on galleries and escape routes.": "Vervangt sinds 2024 het Bouwbesluit. We houden rekening met de eisen voor gebruiksveiligheid, bijvoorbeeld op galerijen en vluchtroutes.", "Food-zone hygiene": "Hygiëne in voedselzones", "Seamless floors with coved skirting (holle plint), easy to clean and disinfect, for kitchens and food plants.": "Naadloze vloeren met holle plint, eenvoudig te reinigen en te desinfecteren, voor keukens en voedingsbedrijven.", "Health & safety": "Veiligheid & gezondheid", "We work in line with the Arbowet and VCA rules: protective equipment, ventilation, marked work zones and safe handling of resins.": "We werken volgens de Arbowet en de VCA-regels: beschermingsmiddelen, ventilatie, afgezette werkzones en veilig werken met harsen.", "Measurements": "Metingen", "Quality record": "Kwaliteitsverslag", "CM moisture (cementitious approx. ≤ 4 %), pull-off ≥ 1.5 N/mm², substrate at least 3 K above dew point, air humidity and layer thickness.": "CM-vocht (cementgebonden ca. ≤ 4 %), hechttrek ≥ 1,5 N/mm², ondergrond minimaal 3 K boven het dauwpunt, luchtvochtigheid en laagdikte.", "Which system: PMMA, epoxy or PU?": "Welk systeem: PMMA, epoxy of PU?", "Outdoors and where time matters (balconies, galleries), usually PMMA. Inside halls and warehouses, epoxy. For car parks and structures that move, elastic PU. For kitchens and production, troffelvloer or PU-cement. We make the final choice after on-site measurements.": "Buiten en waar tijd telt (balkons, galerijen) meestal PMMA. In hallen en magazijnen epoxy. Voor parkeergarages en constructies die bewegen elastisch PU. Voor keukens en productie een troffelvloer of PU-cement. De definitieve keuze maken we na metingen op locatie.", "How long does it take?": "Hoe lang duurt het?", "A balcony or gallery section in PMMA: usually one day. A private garage: 2–3 days. A hall of several thousand m²: from a few days to a few weeks, in phases. The exact schedule is in the quotation.": "Een balkon of galerijsectie in PMMA: meestal één dag. Een privégarage: 2–3 dagen. Een hal van enkele duizenden m²: van enkele dagen tot enkele weken, in fases. De exacte planning staat in de offerte.", "Can you work in low temperatures?": "Kunnen jullie werken bij lage temperaturen?", "PMMA yes, from approx. 0 °C substrate temperature. Epoxy and PU usually need at least 10 °C and a substrate at least 3 K above the dew point. We check this with an instrument before every layer.": "PMMA wel, vanaf een ondergrondtemperatuur van ca. 0 °C. Epoxy en PU hebben meestal minimaal 10 °C nodig en een ondergrond die minstens 3 K boven het dauwpunt ligt. We meten dit vóór elke laag.", "Is the work dusty or disruptive?": "Geeft het werk veel stof of overlast?", "We grind and blast with industrial dust extraction, so there is little dust. Resins smell during application, so we provide ventilation and inform building users.": "We schuren en stralen met industriële stofafzuiging, dus er komt weinig stof vrij. Harsen ruiken tijdens het aanbrengen; daarom zorgen we voor ventilatie en informeren we de gebruikers van het gebouw.", "Do you give a warranty?": "Geven jullie garantie?", "Yes. Warranty terms and period are written into the quotation for the specific system and substrate. They are based on the measurement records taken before work.": "Ja. De garantievoorwaarden en -termijn leggen we vast in de offerte, per systeem en ondergrond. Ze zijn gebaseerd op de meetverslagen van vóór de werkzaamheden.", "Do you work for VvEs and property managers?": "Werken jullie voor VvE's en beheerders?", "Yes, it is a large part of our balcony and gallery work. We prepare a quotation the VvE board can follow, a schedule and resident letters.": "Ja, dat is een groot deel van ons werk aan balkons en galerijen. We maken een offerte die het VvE-bestuur goed kan volgen, een planning en bewonersbrieven.", "How do I maintain a resin floor?": "Hoe onderhoud ik een kunstharsvloer?", "Day to day, cleaning with a neutral detergent (pH 7–9) and a soft brush or scrubber is enough. At handover we give a maintenance guide matched to the system.": "Dagelijks reinigen met een neutraal middel (pH 7–9) en een zachte borstel of schrobmachine is voldoende. Bij de oplevering krijgt u een onderhoudsadvies dat past bij het systeem.", "Which region do you cover?": "In welke regio werken jullie?", "The whole of the Netherlands. For large projects also Belgium and Germany by arrangement.": "In heel Nederland. Voor grote projecten in overleg ook in België en Duitsland.", "Free inspection": "Gratis inspectie", "Tell us about your surface. We reply with a plan and a quote.": "Vertel ons over uw oppervlak. U krijgt een plan en een offerte.", "We visit, measure and advise a system. Quotation (offerte) within a few working days.": "We komen langs, meten en adviseren een systeem. Offerte binnen enkele werkdagen.", "Request a quote": "Offerte aanvragen", "Home": "Home", "Concrete protection · since 2016": "Betonbescherming · sinds 2016", "Concrete that <em>outlasts</em> everything.": "Beton dat <em>alles</em> doorstaat.", "Seamless PMMA, epoxy and polyurethane coatings and troffelvloer. From halls of thousands of m² to balconies, galleries and garages, across the Netherlands.": "Naadloze PMMA-, epoxy- en polyurethaancoatings en troffelvloeren. Van hallen van duizenden m² tot balkons, galerijen en garages, in heel Nederland.", "See our work": "Bekijk ons werk", "Pour": "Gieten", "Spread": "Verdelen", "Broadcast": "Instrooien", "Seal": "Afsluiten", "years of experience in the Netherlands": "jaar ervaring in Nederland", "systems: PMMA, EP, PU, troffel": "systemen: PMMA, EP, PU, troffel", "PMMA cure on a balcony": "uitharding PMMA op een balkon", "work to NEN-EN standards": "werk volgens NEN-EN-normen", "Systems": "Systemen", "Four chemistries. One rule: match the substrate and the load.": "Vier chemieën. Eén regel: afgestemd op ondergrond en belasting.", "We do not sell one resin for everything. Each system has different strengths, and we choose after measuring on site.": "We verkopen niet één hars voor alles. Elk systeem heeft andere sterke punten, en we kiezen pas na metingen op locatie.", "Details": "Details", "System cross-section": "Doorsnede van het systeem", "Protection is built layer by layer.": "Bescherming wordt laag voor laag opgebouwd.", "Every layer has a job: the primer bonds to the concrete, the membrane seals, the broadcast gives grip and the topcoat protects against UV, chemicals and wear.": "Elke laag heeft een taak: de primer hecht aan het beton, het membraan dicht af, de instrooiing geeft grip en de toplaag beschermt tegen UV, chemicaliën en slijtage.", "typical thicknesses, not to scale": "gangbare laagdiktes, niet op schaal", "Applications": "Toepassingen", "From thousands of metres to a single balcony.": "Van duizenden meters tot één balkon.", "We do large surfaces end to end, with grinding and substrate preparation. Small ones with the same care, and fast.": "Grote oppervlakken doen we compleet, inclusief schuren en voorbereiden van de ondergrond. Kleine met dezelfde zorg, en snel.", "Werkwijze": "Werkwijze", "Five stages. Each one recorded.": "Vijf stappen. Elke stap vastgelegd.", "Most of a coating’s life is decided in preparation. That is why we measure before we pour anything.": "De levensduur van een coating wordt grotendeels bepaald in de voorbereiding. Daarom meten we voordat we ook maar iets gieten.", "Full process": "Volledige werkwijze", "About us": "Over ons", "Ten years, hundreds of balconies and halls. <b>No shortcuts</b> in substrate preparation.": "Tien jaar, honderden balkons en hallen. <b>Geen concessies</b> bij de voorbereiding van de ondergrond.", "Premium CoatUp is a team of resin-flooring specialists working in the Netherlands since 2016. We work for companies, VvEs, property managers and private clients.": "Premium CoatUp is een team van specialisten in kunstharsvloeren, sinds 2016 actief in Nederland. We werken voor bedrijven, VvE's, vastgoedbeheerders en particulieren.", "Meet us": "Maak kennis", "Our specialist at work on a gallery": "Onze specialist aan het werk op een galerij", "Services": "Diensten", "Systems and applications": "Systemen en toepassingen", "Choose a system by chemistry, or by the place you want to protect.": "Kies een systeem op basis van de chemie, of op basis van de plek die u wilt beschermen.", "By system": "Per systeem", "The chemistries we work with": "De chemieën waarmee we werken", "By location": "Per locatie", "Where we work": "Waar we werken", "Comparison": "Vergelijking", "Systems side by side": "Systemen naast elkaar", "Typical values. Exact performance depends on product and substrate.": "Gangbare waarden. De exacte prestaties hangen af van product en ondergrond.", "Curing": "Uitharding", "~1 h": "~1 uur", "Outdoor / UV": "Buiten / UV", "with PU topcoat": "met PU-toplaag", "indoor": "binnen", "Elasticity": "Elasticiteit", "high": "hoog", "low": "laag", "Mechanical load": "Mechanische belasting", "medium": "gemiddeld", "medium–high": "gemiddeld–hoog", "Slip": "Slip", "System": "Systeem", "What it is and when we use it": "Wat het is en wanneer we het toepassen", "Datasheet": "Technische gegevens", "Typical values; final figures per product datasheet and site conditions.": "Gangbare waarden; definitieve waarden volgens het productblad en de omstandigheden op locatie.", "Build-up": "Opbouw", "Layer build-up": "Laagopbouw", "From concrete to the wearing surface.": "Van beton tot slijtlaag.", "Typical uses": "Toepassingen", "Typical thicknesses, not to scale": "Gangbare laagdiktes, niet op schaal", "Other systems": "Andere systemen", "Compare with the others": "Vergelijk met de andere", "How we work": "Onze werkwijze", "Included": "Inbegrepen", "What the service covers": "Wat de dienst omvat", "Recommended systems": "Aanbevolen systemen", "Projects": "Projecten", "From our sites": "Van onze bouwplaatsen", "Balconies & galleries": "Balkons & galerijen", "Garages & car parks": "Garages & parkeergarages", "Industrial & kitchens": "Industrie & keukens", "Our projects": "Onze projecten", "Photos of work done by our team: galleries, balconies, car park ramps and commercial kitchens.": "Foto's van werk door ons team: galerijen, balkons, hellingbanen van parkeergarages en grootkeukens.", "All": "Alle", "A process in line with Dutch contracting practice: from measurements and substrate preparation to the handover report (opleverrapport).": "Een werkwijze volgens de Nederlandse aannemerspraktijk: van metingen en voorbereiding van de ondergrond tot het opleverrapport.", "Grinding, shot blasting, milling": "Schuren, stralen, frezen", "A coating is only as good as the concrete beneath it. We remove laitance, old paints and contamination, open the pores and check the strength.": "Een coating is zo goed als het beton eronder. We verwijderen cementhuid, oude verf en vervuiling, openen de poriën en controleren de sterkte.", "Diamond grinding: indoor floors, smooth substrates": "Diamantschuren: binnenvloeren, gladde ondergronden", "Shot blasting: large halls and car parks, fast and dust-free": "Kogelstralen: grote hallen en parkeergarages, snel en stofvrij", "Milling: thick old coatings and unevenness": "Frezen: dikke oude coatings en oneffenheden", "Repairs with resin and PCC mortars": "Herstel met hars en PCC-mortels", "Documentation": "Documentatie", "What you get in writing": "Wat u op papier krijgt", "System description, layer thicknesses, substrate preparation, schedule, price per m² and warranty terms.": "Systeembeschrijving, laagdiktes, voorbereiding van de ondergrond, planning, prijs per m² en garantievoorwaarden.", "Measurement record": "Meetverslag", "CM moisture, pull-off, temperature, air humidity and dew point for each phase.": "CM-vocht, hechttrek, temperatuur, luchtvochtigheid en dauwpunt per fase.", "Handover report with photos, maintenance guide and usage recommendations.": "Opleverrapport met foto's, onderhoudsadvies en gebruiksaanwijzingen.", "Quality & standards": "Kwaliteit & normen", "We work to Dutch and European standards": "We werken volgens Nederlandse en Europese normen", "We select and document every system to the standards that apply in the Netherlands, so the inspector, the VvE and the insurer have clarity.": "Elk systeem kiezen en documenteren we volgens de normen die in Nederland gelden, zodat de inspecteur, de VvE en de verzekeraar duidelijkheid hebben.", "Standards": "Normen", "R-class matched to the zone": "R-klasse afgestemd op de zone", "Too little grip is an accident risk; too much makes cleaning hard. We find the balance.": "Te weinig grip is een risico op ongevallen, te veel maakt reinigen lastig. Wij vinden de balans.", "corridors, offices, showrooms": "gangen, kantoren, showrooms", "covered galleries, garages, warehouses": "overdekte galerijen, garages, magazijnen", "balconies, kitchens, workshops": "balkons, keukens, werkplaatsen", "commercial kitchens, ramps": "grootkeukens, hellingbanen", "oily and greasy zones, steep ramps": "zones met olie en vet, steile hellingbanen", "10 years of precision in concrete": "10 jaar precisie in beton", "Premium CoatUp has worked in the Netherlands since 2016. We specialise only in resin coatings for concrete.": "Premium CoatUp werkt sinds 2016 in Nederland. We zijn uitsluitend gespecialiseerd in kunstharscoatings op beton.", "Story": "Ons verhaal", "Narrow focus, full responsibility": "Smalle focus, volledige verantwoordelijkheid", "We started with balconies and garages. Today we also do halls, commercial kitchens and multi-storey car parks, but the rule is the same: one team from measurement to handover.": "We begonnen met balkons en garages. Nu doen we ook hallen, grootkeukens en parkeergarages, maar de regel is dezelfde: één team van meting tot oplevering.", "We do not subcontract substrate preparation, because it decides durability. We have our own grinders, shot blasters and industrial extractors, and our people know how each resin behaves in the Dutch climate.": "We besteden de voorbereiding van de ondergrond niet uit, want die bepaalt de levensduur. We hebben eigen schuurmachines, straalmachines en industriële stofzuigers, en onze mensen weten hoe elke hars zich gedraagt in het Nederlandse klimaat.", "founded": "opgericht", "years in the NL market": "jaar op de Nederlandse markt", "languages we speak": "talen die we spreken", "team from survey to handover": "team van inspectie tot oplevering", "Values": "Waarden", "What we care about": "Waar we om geven", "Measure before we promise": "Eerst meten, dan beloven", "No warranty without measurements. That is why our floors do not peel.": "Geen garantie zonder metingen. Daarom laten onze vloeren niet los.", "A clean site": "Een schone bouwplaats", "Dust extraction, protected walls and doors, a tidy site at the end of every day.": "Stofafzuiging, beschermde wanden en deuren, een opgeruimde werkplek aan het eind van elke dag.", "Clear communication": "Heldere communicatie", "Quotation, schedule and records in Polish, English or Dutch.": "Offerte, planning en verslagen in het Nederlands, Engels of Pools.", "Frequently asked questions": "Veelgestelde vragen", "If you cannot find the answer, write to us.": "Staat uw antwoord er niet bij? Schrijf ons.", "Contact": "Contact", "Request a free inspection": "Vraag een gratis inspectie aan", "Describe your surface and we will get back to you within one working day.": "Beschrijf uw oppervlak en u hoort binnen één werkdag van ons.", "Surface type": "Type oppervlak", "Balcony / terrace / gallery": "Balkon / terras / galerij", "Garage / car park": "Garage / parkeergarage", "Hall / warehouse": "Hal / magazijn", "Kitchen / food": "Keuken / voeding", "Area (m²)": "Oppervlakte (m²)", "Preferred system": "Voorkeurssysteem", "Advise me": "Adviseer mij", "Name / company": "Naam / bedrijf", "City": "Plaats", "Phone": "Telefoon", "Description": "Omschrijving", "Concrete condition, timing, access, whether the building is in use…": "Staat van het beton, gewenste periode, bereikbaarheid, of het pand in gebruik is…", "Send request": "Aanvraag versturen", "Phone / WhatsApp": "Telefoon / WhatsApp", "Service area": "Werkgebied", "The whole Netherlands": "Heel Nederland", "Hours": "Openingstijden", "Mon–Fri 7:00–17:00": "ma–vr 7:00–17:00", "All services": "Alle diensten", "Process": "Werkwijze", "About": "Over ons", "PMMA, epoxy and PU coatings and troffelvloer. Concrete protection across the Netherlands since 2016.": "PMMA-, epoxy- en PU-coatings en troffelvloeren. Betonbescherming in heel Nederland sinds 2016.", "Company": "Bedrijf", "Get a quote": "Offerte", "Enter your name or company and a valid e-mail address so we can reply.": "Vul uw naam of bedrijfsnaam en een geldig e-mailadres in, zodat we kunnen reageren.", "Quote request": "Offerteaanvraag", "Surface": "Oppervlak", "Client": "Klant", "Thank you, your request is ready": "Bedankt, uw aanvraag staat klaar", "Copy the text and send it to": "Kopieer de tekst en stuur hem naar", "or via WhatsApp.": "of via WhatsApp.", "Copy text": "Tekst kopiëren", "Copied": "Gekopieerd", "Selected, press Ctrl+C": "Geselecteerd, druk op Ctrl+C"};

const isoTimers=new WeakMap();
function isoPlay(box){

const BA={p:0,f:0,tw:null,auto:[],io:null};
function baApply(){
 const fr=document.getElementById('baframe');if(!fr)return;const st=BA_ST();
 const p=BA.p,f=BA.f,v=p+f;
 fr.querySelectorAll('img').forEach(im=>{const k=+im.dataset.k;
  if(k===p){im.style.display='block';im.style.zIndex=1;im.style.clipPath='none';}
  else if(k===p+1){im.style.display='block';im.style.zIndex=2;im.style.clipPath=`inset(0 ${((1-f)*100).toFixed(2)}% 0 0)`;}
  else im.style.display='none';});
 const line=document.getElementById('ba-line');line.style.left=(f*100)+'%';line.style.opacity=f>0.005&&f<0.995?1:0;
 const tl=document.getElementById('ba-tl'),tr=document.getElementById('ba-tr');
 tl.textContent=`0${p+2} · ${st[p+1][0]}`;tr.textContent=`0${p+1} · ${st[p][0]}`;
 tl.style.opacity=f>.22?1:0;tr.style.opacity=f<.78?1:0;
 const cur=Math.round(v);document.getElementById('ba-num').textContent='0'+(cur+1);document.getElementById('ba-name').textContent=st[cur][0];
 const r=document.getElementById('ba-range');r.value=Math.round(v*100);r.style.setProperty('--p',(v/3*100)+'%');
 document.querySelectorAll('#ba [data-ba]').forEach(b=>{const k=+b.dataset.ba;b.classList.toggle('on',k===cur);b.classList.toggle('done',k<cur);});
 document.querySelectorAll('#ba .bsteps li').forEach((li,k)=>{const fill=Math.max(0,Math.min(1,v-k+1));li.querySelector('.bp i').style.width=(k===0?100:fill*100)+'%';});
}
function baSetV(v){v=Math.max(0,Math.min(3,v));BA.p=Math.min(2,Math.floor(v));BA.f=v-BA.p;baApply();}
function baStop(){BA.auto.forEach(clearTimeout);BA.auto=[];if(BA.tw)cancelAnimationFrame(BA.tw);BA.tw=null;}
function baGo(to,dur,done){if(BA.tw)cancelAnimationFrame(BA.tw);const from=BA.p+BA.f,t0=performance.now(),e=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
 const step=now=>{const k=Math.min(1,(now-t0)/dur);baSetV(from+(to-from)*e(k));if(k<1)BA.tw=requestAnimationFrame(step);else{BA.tw=null;done&&done();}};BA.tw=requestAnimationFrame(step);}
function baAuto(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;baStop();baSetV(0);const seq=[[1,1400],[2,1400],[3,1400],[2.5,900]];let t=700;
 seq.forEach(([v,d],i)=>{BA.auto.push(setTimeout(()=>baGo(v,d),t));t+=d+(i<2?900:1300);});}
function baInit(){
 const fr=document.getElementById('baframe');if(!fr)return;BA.p=0;BA.f=0;baApply();
 let drag=false;
 const at=e=>{const r=fr.getBoundingClientRect();BA.f=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));baApply();};
 fr.addEventListener('pointerdown',e=>{baStop();drag=true;fr.setPointerCapture(e.pointerId);if(BA.f>=.999&&BA.p<2){}at(e);});
 fr.addEventListener('pointermove',e=>{if(drag)at(e);});
 fr.addEventListener('pointerup',()=>drag=false);fr.addEventListener('pointercancel',()=>drag=false);
 const rg=document.getElementById('ba-range');rg.addEventListener('input',()=>{baStop();baSetV(rg.value/100);});
 document.querySelectorAll('#ba [data-ba]').forEach(b=>b.addEventListener('click',()=>{baStop();const k=+b.dataset.ba;baGo(k===0?0:k,900);}));
 fr.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){baStop();baSetV(BA.p+BA.f+(e.key==='ArrowRight'?.1:-.1));e.preventDefault();}});
 fr.tabIndex=0;
 if(BA.io)BA.io.disconnect();
 if('IntersectionObserver' in window){BA.io=new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting){BA.io.disconnect();baAuto();}}),{threshold:.45});BA.io.observe(fr);}
}

function wizValidate(){

 if(qStep===2&&!Q.m2r&&!Q.m2)return T('Wybierz zakres powierzchni albo wpisz liczbę m².','Choose a size range or enter the m².','Kies een bereik of vul het aantal m² in.');
 if(qStep===3){
  if(!Q.name.trim())return T('Podaj imię i nazwisko.','Enter your name.','Vul uw naam in.');
  if(!Q.phone.trim()&&!/^\S+@\S+\.\S+$/.test(Q.email))return T('Podaj numer telefonu lub poprawny e-mail.','Enter a phone number or a valid e-mail.','Vul een telefoonnummer of een geldig e-mailadres in.');
  if(!Q.city.trim())return T('Podaj miejscowość projektu.','Enter the project city.','Vul de plaats van het project in.');

 }
 return '';
}

function wizRead(t){
 if(!t.closest||!t.closest('#qform'))return;
 const g=t.name;if(!g)return;
 if(t.type==='checkbox'&&Array.isArray(Q[g])){const s=new Set(Q[g]);t.checked?s.add(t.value):s.delete(t.value);Q[g]=[...s];}
 else if(t.type==='checkbox')Q[g]=t.checked;
 else if(t.type==='radio'){Q[g]=t.value;if(g==='m2r'){Q.m2='';const i=document.getElementById('q-m2');if(i)i.value='';}}
 else{Q[g]=t.value;if(g==='m2'&&t.value){Q.m2r='';document.querySelectorAll('input[name="m2r"]').forEach(r=>r.checked=false);}}
 if(qErr&&!wizValidate()){qErr='';const e=document.querySelector('.werr');if(e)e.remove();}
 if((t.type==='checkbox'&&t.checked)||t.type==='radio')flyTo(t.closest('label'));else reqUpdate();
}

/* ---------- smooth inertia scroll (Lenis-style) ---------- */
const SS={y:scrollY,t:scrollY,on:false};
const ssMax=()=>Math.max(0,document.documentElement.scrollHeight-innerHeight);
function ssStop(){SS.on=false;SS.y=SS.t=scrollY;}
if(FINE&&!RM){
 addEventListener('wheel',e=>{
  if(e.ctrlKey||Math.abs(e.deltaX)>Math.abs(e.deltaY))return;
  if(e.target.closest&&e.target.closest('textarea,select,.mnav,.lb,.mega,.victory,#intro'))return;
  e.preventDefault();
  if(!SS.on){SS.y=scrollY;SS.t=scrollY;}
  const k=e.deltaMode===1?40:e.deltaMode===2?innerHeight:1;
  SS.t=clamp(SS.t+e.deltaY*k,0,ssMax());SS.on=true;
 },{passive:false});
 addEventListener('keydown',ssStop);
 addEventListener('touchstart',ssStop,{passive:true});
}
function ssStep(){if(!SS.on)return;SS.y+=(SS.t-SS.y)*.1;if(Math.abs(SS.t-SS.y)<.5){SS.y=SS.t;SS.on=false;}scrollTo(0,SS.y);}

function rollHTML(v,zero){return String(v).split('').map((ch,i)=>/\d/.test(ch)?`<span class="rnd"><span class="rns" style="--d:${zero?0:ch};--dl:${i*90}ms">${DIG}</span></span>`:`<span class="rnx">${ch}</span>`).join('');}
function rollSet(el,v){const s=String(v),cols=el.querySelectorAll('.rns');if(cols.length!==s.replace(/\D/g,'').length){el.innerHTML=rollHTML(s);return;}let j=0;[...s].forEach(ch=>{if(/\d/.test(ch))cols[j++].style.setProperty('--d',ch);});}

/* ---------- split text (kinetic typography) ---------- */
function splitText(el,mode){
 if(el.dataset.split)return;el.dataset.split='1';let i=0;
 const walk=(node,inGt)=>{[...node.childNodes].forEach(ch=>{
  if(ch.nodeType===3){const frag=document.createDocumentFragment();
   ch.textContent.split(/(\s+)/).forEach(pt=>{if(!pt)return;if(/^\s+$/.test(pt)){frag.appendChild(document.createTextNode(' '));return;}
    const w=document.createElement('span');w.className='sw';
    if(mode==='chars'&&!inGt){[...pt].forEach(c=>{const s=document.createElement('span');s.className='sc';s.textContent=c;s.style.setProperty('--i',i++);w.appendChild(s);});}
    else{const s=document.createElement('span');s.className='sc'+(inGt?' gt':'');s.textContent=pt;s.style.setProperty('--i',i);i+=mode==='chars'?Math.max(2,pt.length*.6|0):1;w.appendChild(s);}
    frag.appendChild(w);});
   ch.replaceWith(frag);}
  else if(ch.nodeType===1&&ch.tagName!=='BR'){const g=ch.classList.contains('gt');if(g)ch.classList.remove('gt');walk(ch,inGt||g);}
 });};
 walk(el,false);el.classList.add('kt',mode==='chars'?'kt-c':'kt-w');
}

/* ---------- WebGL smoke shader ---------- */
function smokeGL(cv,o){
 let gl;try{gl=cv.getContext('webgl',{premultipliedAlpha:true,alpha:true,antialias:false});}catch(e){}
 if(!gl)return null;
 const vs='attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';
 const fs=`precision mediump float;uniform vec2 r;uniform float t;uniform vec3 c1;uniform vec3 c2;uniform float a;
 float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
 float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}
 float fbm(vec2 p){float v=0.,s=.5;for(int i=0;i<5;i++){v+=s*n(p);p=p*2.03+vec2(1.7,9.2);s*=.5;}return v;}
 void main(){vec2 uv=gl_FragCoord.xy/r;vec2 p=uv*vec2(r.x/r.y,1.)*2.4;
  vec2 q=vec2(fbm(p+vec2(0.,t*.045)),fbm(p+vec2(5.2,1.3)-t*.035));
  vec2 w=vec2(fbm(p+3.*q+vec2(1.7,9.2)+t*.02),fbm(p+3.*q+vec2(8.3,2.8)-t*.025));
  float f=fbm(p+2.6*w);
  vec3 col=mix(c1,c2,smoothstep(.45,1.,f+.15*w.x));
  float al=smoothstep(.32,.95,f)*a*(.45+.55*uv.y);
  gl_FragColor=vec4(col*al,al);}`;
 const sh=(type,src)=>{const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);return s;};
 const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,vs));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(pr);
 if(!gl.getProgramParameter(pr,gl.LINK_STATUS))return null;
 gl.useProgram(pr);const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
 const loc=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
 const U=k=>gl.getUniformLocation(pr,k);const ur=U('r'),ut=U('t');
 gl.uniform3fv(U('c1'),o.c1);gl.uniform3fv(U('c2'),o.c2);gl.uniform1f(U('a'),o.a);
 let raf=0,on=false;const t0=performance.now()-Math.random()*20000;
 const size=()=>{const rc=cv.getBoundingClientRect(),q=.45*Math.min(2,devicePixelRatio||1);cv.width=Math.max(2,rc.width*q|0);cv.height=Math.max(2,rc.height*q|0);gl.viewport(0,0,cv.width,cv.height);};
 const draw=now=>{gl.uniform2f(ur,cv.width,cv.height);gl.uniform1f(ut,(now-t0)/1000);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);};
 const loop=now=>{if(!on||!cv.isConnected){on=false;return;}raf=requestAnimationFrame(loop);draw(now);};
 return{start(){if(on)return;size();if(RM){draw(performance.now());return;}on=true;raf=requestAnimationFrame(loop);},stop(){on=false;cancelAnimationFrame(raf);},size};
}

/* ---------- dust particles in the light beams ---------- */
function dustFX(cv){
 const g=cv.getContext('2d');let W=0,H=0,P=[],on=false,raf=0;
 const size=()=>{const rc=cv.getBoundingClientRect();W=cv.width=rc.width|0;H=cv.height=rc.height|0;P=Array.from({length:Math.min(140,Math.round(W*H/8000))},()=>({x:Math.random()*W,y:Math.random()*H,r:.4+Math.random()*1.7,v:5+Math.random()*16,ph:Math.random()*6.28}));};
 const beams=[.5,.66,.82];
 const fr=now=>{if(!on||!cv.isConnected){on=false;return;}raf=requestAnimationFrame(fr);g.clearRect(0,0,W,H);const t=now/1000;
  for(const p of P){p.y-=p.v*.016;p.x+=Math.sin(t*.5+p.ph)*.22;if(p.y<-6){p.y=H+6;p.x=Math.random()*W;}
   const fy=1-p.y/H;let bm=0;for(const b of beams){const cx=b+(fy-.5)*.06,wd=.03+.09*(1-fy);bm=Math.max(bm,1-Math.abs(p.x/W-cx)/wd);}
   const fl=.4+.6*Math.abs(Math.sin(t*1.2+p.ph));g.globalAlpha=Math.min(1,(.08+Math.max(0,bm)*.75)*fl);g.fillStyle='#f6e7c4';g.beginPath();g.arc(p.x,p.y,p.r,0,7);g.fill();}};
 return{start(){if(on||RM)return;size();on=true;raf=requestAnimationFrame(fr);},stop(){on=false;cancelAnimationFrame(raf);},size};
}

 ov.addEventListener('click',end);setTimeout(end,4300);
 const img=new Image();img.onerror=end;
 img.onload=()=>{
  const tw=Math.min(W*.66,720*dpr),th=tw*img.height/img.width,stepCss=innerWidth<700?3:4,sw=Math.round(tw/(stepCss*dpr)),sh=Math.round(th/(stepCss*dpr));
  const oc=document.createElement('canvas');oc.width=sw;oc.height=sh;const og=oc.getContext('2d');og.drawImage(img,0,0,sw,sh);
  let d;try{d=og.getImageData(0,0,sw,sh).data;}catch(e){end();return;}const P=[],ox=(W-tw)/2,oy=(H-th)/2-H*.03,st=tw/sw;
  for(let y=0;y<sh;y++)for(let x=0;x<sw;x++){const k=(y*sw+x)*4;if(d[k+3]<130)continue;const l=(d[k]+d[k+1]+d[k+2])/3;if(l<70&&Math.random()<.7)continue;
   const a=Math.random()*6.283,rad=(.35+Math.random()*.9)*Math.max(W,H);
   P.push({tx:ox+x*st,ty:oy+y*st,x:W/2+Math.cos(a)*rad,y:H/2+Math.sin(a)*rad,c:l>200?'#f3f2ef':l>110?'#aeb2b4':'#e4c792',dl:x/sw*.4+Math.random()*.3});}
  const t0=performance.now(),D=1.35;
  const fr=now=>{if(fin)return;const t=(now-t0)/1000;g.clearRect(0,0,W,H);

function confetti(x,y,n){
 if(RM)return;n=n||150;let cv=document.getElementById('confetti');
 if(!cv){cv=document.createElement('canvas');cv.id='confetti';document.body.appendChild(cv);}
 const dpr=Math.min(2,devicePixelRatio||1);if(!FX.confOn){cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;}
 const g=cv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);
 const pal=['#f3f2ef','#17181a','#8a8e91','#e4c792','#c99c5a','#5a5e61','#d6d8d9'];const P=FX.conf||(FX.conf=[]);
 for(let i=0;i<n;i++){const a=-Math.PI/2+(Math.random()-.5)*Math.PI*1.25,s=280+Math.random()*760;P.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:Math.random()*6.28,vr:(Math.random()-.5)*14,s:2.5+Math.random()*5.5,c:pal[i%pal.length],k:5+(i%4),life:0});}
 if(FX.confOn)return;FX.confOn=true;let last=performance.now();
 const fr=now=>{const dt=Math.min(.04,(now-last)/1000);last=now;g.clearRect(0,0,innerWidth,innerHeight);
  for(let i=P.length-1;i>=0;i--){const p=P[i];p.vy+=1250*dt;p.vx*=.986;p.vy*=.986;p.x+=p.vx*dt;p.y+=p.vy*dt;p.r+=p.vr*dt;p.life+=dt;
   if(p.y>innerHeight+40||p.life>4.5){P.splice(i,1);continue;}
   g.save();g.translate(p.x,p.y);g.rotate(p.r);g.scale(1,Math.cos(p.life*7+p.vr));g.fillStyle=p.c;g.beginPath();
   for(let j=0;j<p.k;j++){const a=j/p.k*6.283;g.lineTo(Math.cos(a)*p.s,Math.sin(a)*p.s*.85);}g.closePath();g.fill();g.restore();}
  if(P.length)requestAnimationFrame(fr);else{FX.confOn=false;g.clearRect(0,0,innerWidth,innerHeight);}};
 requestAnimationFrame(fr);
}
