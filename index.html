<script>
(function(){
const NLD={"PMMA coatings": "PMMA-coatings", "Rapid-cure waterproofing": "Snelhardende waterdichting", "Methyl methacrylate cures in about an hour, even in cold weather. Ideal for balconies, galleries and ramps where residents cannot wait.": "Methylmethacrylaat hardt uit in ongeveer een uur, ook bij koud weer. Ideaal voor balkons, galerijen en hellingbanen waar bewoners niet kunnen wachten.", "PMMA is a liquid waterproofing membrane and a wearing floor in one. It cures in about 60 minutes, resists UV and standing water, and with a fleece reinforcement it bridges cracks in the concrete. It is our standard for balconies, galleries (galerijen) and terraces on VvE projects.": "PMMA is een vloeibare waterdichting en een slijtvaste vloer in één. Het hardt uit in ongeveer 60 minuten, is bestand tegen UV en staand water en overbrugt met een vliesversterking scheuren in het beton. Het is onze standaard voor balkons, galerijen en terrassen bij VvE-projecten.", "Because PMMA cures chemically rather than by evaporation, we can work at substrate temperatures from around 0 °C. Layers go on the same day, so a 40 m gallery is often finished in one or two working days, in sections, so residents always keep access to their front door.": "Omdat PMMA chemisch uithardt en niet door verdamping, kunnen we werken bij een ondergrondtemperatuur vanaf circa 0 °C. Alle lagen gaan dezelfde dag op, dus een galerij van 40 m is vaak in één tot twee werkdagen klaar, in secties, zodat bewoners altijd bij hun voordeur kunnen.", "We finish with a coloured-quartz or flake broadcast and a slip class chosen for the location: R10 on covered galleries, R11–R12 on open balconies and ramps. Details at thresholds, drains and balustrade posts are done in the same material, without joints.": "We werken af met ingestrooid gekleurd kwarts of flakes en een slipklasse die past bij de plek: R10 op overdekte galerijen, R11–R12 op open balkons en hellingbanen. Details bij dorpels, afvoeren en balusterstaanders maken we naadloos in hetzelfde materiaal.", "System thickness": "Systeemdikte", "Cure (20 °C)": "Uitharding (20 °C)", "approx. 60 min": "ca. 60 min", "Foot traffic": "Beloopbaar", "after approx. 2 h": "na ca. 2 uur", "Application temp.": "Verwerkingstemp.", "from approx. 0 °C (substrate)": "vanaf ca. 0 °C (ondergrond)", "UV resistance": "UV-bestendigheid", "yes, non-yellowing": "ja, vergeelt niet", "Crack bridging": "Scheuroverbruggend", "yes (with fleece)": "ja (met vlies)", "Slip resistance": "Slipweerstand", "Balconies and loggias": "Balkons en loggia's", "Galleries and outdoor stairwells (VvE)": "Galerijen en buitentrappenhuizen (VvE)", "Terraces over living space": "Terrassen boven woonruimte", "Ramps and driveways": "Hellingbanen en opritten", "Repairs in low temperatures": "Herstel bij lage temperaturen", "PMMA topcoat, matte": "PMMA-toplaag, mat", "Quartz / flake broadcast": "Kwarts- / flake-instrooiing", "PMMA membrane + fleece": "PMMA-membraan + vlies", "PMMA primer": "PMMA-primer", "Concrete (ground)": "Beton (geschuurd)", "Epoxy floors": "Epoxyvloeren", "Hardness and chemical resistance": "Hardheid en chemische bestendigheid", "Self-levelling or roller-applied epoxy systems for halls, warehouses, workshops and showrooms. Seamless and easy to maintain.": "Zelfnivellerende of gerolde epoxysystemen voor hallen, magazijnen, werkplaatsen en showrooms. Naadloos en onderhoudsvriendelijk.", "Epoxy resin gives a very hard, sealed and chemically resistant surface. We apply it as a rolled coating (0.3–0.5 mm), a quartz-broadcast system or a 2–3 mm self-levelling floor, classified to NEN-EN 13813 as SR.": "Epoxyhars geeft een zeer hard, gesloten en chemisch bestendig oppervlak. We brengen het aan als gerolde coating (0,3–0,5 mm), als ingestrooid kwartssysteem of als zelfnivellerende gietvloer van 2–3 mm, geclassificeerd volgens NEN-EN 13813 als SR.", "Epoxy performs best indoors. Outdoors, and wherever daylight reaches the floor, we seal it with a UV-stable polyurethane topcoat, because epoxy alone yellows over time. Colours come from the RAL range; the floor can get decorative flakes, safety lines and zone markings.": "Epoxy presteert het best binnen. Buiten, en overal waar daglicht op de vloer valt, sluiten we af met een UV-bestendige polyurethaan toplaag, omdat epoxy alleen na verloop van tijd vergeelt. Kleuren kiest u uit het RAL-palet; de vloer kan decoratieve flakes, veiligheidslijnen en zonemarkering krijgen.", "Before pouring we measure concrete moisture by the CM method (max. approx. 4 % for cementitious substrates), pull-off strength (min. 1.5 N/mm²) and the dew point. We do not give a warranty without these measurements, because they decide adhesion.": "Voordat we gieten meten we het vochtgehalte van het beton met de CM-methode (max. ca. 4 % bij cementgebonden ondergronden), de hechttreksterkte (min. 1,5 N/mm²) en het dauwpunt. Zonder deze metingen geven we geen garantie, want zij bepalen de hechting.", "Thickness": "Dikte", "Classification": "Classificatie", "after approx. 24 h": "na ca. 24 uur", "Full load": "Volledig belastbaar", "after approx. 7 days": "na ca. 7 dagen", "Chemical resistance": "Chemische bestendigheid", "very high": "zeer hoog", "needs PU topcoat": "PU-toplaag nodig", "Warehouses and logistics centres": "Magazijnen en distributiecentra", "Production halls": "Productiehallen", "Workshops and garages": "Werkplaatsen en garages", "Showrooms": "Showrooms", "Technical corridors": "Technische gangen", "Sealer coat": "Sealerlaag", "Self-levelling EP layer": "Zelfnivellerende EP-laag", "EP primer + quartz broadcast": "EP-primer + kwartsinstrooiing", "Concrete (diamond ground)": "Beton (diamantgeschuurd)", "Polyurethane systems": "Polyurethaansystemen", "Elasticity and UV stability": "Elasticiteit en UV-bestendigheid", "Elastic, crack-bridging PU coatings for car parks, ramps and balconies, and PU-cement for the food industry.": "Elastische, scheuroverbruggende PU-coatings voor parkeergarages, hellingbanen en balkons, en PU-cement voor de voedingsindustrie.", "Polyurethane moves with the concrete. Where the structure deflects, and where road salt and sunlight act on it, an elastic PU system protects the reinforcement from water and chlorides. We use it on parking decks, ramps and trafficable roofs.": "Polyurethaan beweegt mee met het beton. Waar de constructie doorbuigt en waar strooizout en zonlicht inwerken, beschermt een elastisch PU-systeem de wapening tegen water en chloriden. We passen het toe op parkeerdekken, hellingbanen en beloopbare daken.", "For car parks we build a multi-layer system: epoxy primer, elastic PU membrane, wearing layer with coarse quartz and a UV-stable topcoat. These systems protect concrete in line with NEN-EN 1504-2 and resist tyre marks, oil and salt.": "Voor parkeergarages bouwen we een meerlaags systeem op: epoxyprimer, elastisch PU-membraan, slijtlaag met grof kwarts en een UV-bestendige toplaag. Deze systemen beschermen beton volgens NEN-EN 1504-2 en zijn bestand tegen bandensporen, olie en zout.", "In commercial kitchens and food plants we use PU-cement: 6–9 mm, resistant to thermal shock from hot-water and steam cleaning, to fats and organic acids. We combine it with a coved skirting (holle plint) to meet HACCP requirements.": "In grootkeukens en voedingsbedrijven passen we PU-cement toe: 6–9 mm, bestand tegen thermische schokken bij reiniging met heet water en stoom, tegen vetten en organische zuren. We combineren het met een holle plint, zodat aan de HACCP-eisen wordt voldaan.", "2–4 mm (PU-cement 6–9 mm)": "2–4 mm (PU-cement 6–9 mm)", "yes, elastic system": "ja, elastisch systeem", "yes (aliphatic topcoat)": "ja (alifatische toplaag)", "Vehicle traffic": "Berijdbaar", "after approx. 3–5 days": "na ca. 3–5 dagen", "Concrete protection": "Betonbescherming", "Parking decks and garages": "Parkeerdekken en garages", "Access ramps": "Hellingbanen", "Trafficable roofs and terraces": "Beloopbare daken en terrassen", "Commercial kitchens (PU-cement)": "Grootkeukens (PU-cement)", "Food processing plants": "Voedselverwerkende bedrijven", "UV-stable PU topcoat": "UV-bestendige PU-toplaag", "Wearing layer + coarse quartz": "Slijtlaag + grof kwarts", "Elastic PU membrane": "Elastisch PU-membraan", "EP primer": "EP-primer", "Concrete (shot-blasted)": "Beton (gestraald)", "Troffelvloer": "Troffelvloer", "Trowelled epoxy-quartz screed": "Getroffelde epoxy-kwartsvloer", "The toughest system: 4–8 mm of epoxy-quartz mortar, power-trowelled. For commercial kitchens, production and heavy-duty areas.": "Het zwaarste systeem: 4–8 mm epoxy-kwartsmortel, machinaal getroffeld. Voor grootkeukens, productie en zwaarbelaste ruimtes.", "A troffelvloer is a mortar of epoxy resin and kiln-dried quartz sand, laid 4–8 mm thick and finished with a hand or power trowel. The result is a floor with very high compressive and impact strength, sealed with a closed topcoat.": "Een troffelvloer is een mortel van epoxyhars en gedroogd kwartszand, aangebracht in 4–8 mm en afgewerkt met de hand- of machinetroffel. Het resultaat is een vloer met een zeer hoge druk- en slagvastheid, afgesloten met een dichte toplaag.", "This system is the choice for commercial kitchens, bakeries, meat processing, workshops and halls with forklift traffic. The quartz texture gives R11–R13 slip resistance even on a wet, greasy floor, and the sealer makes daily cleaning easy.": "Dit systeem is de keuze voor grootkeukens, bakkerijen, vleesverwerking, werkplaatsen en hallen met heftruckverkeer. De kwartsstructuur geeft slipklasse R11–R13, ook op een natte, vette vloer, en de sealer maakt dagelijkse reiniging eenvoudig.", "A troffelvloer also lets us form falls to drains and channel gutters without an extra screed. We form coved skirtings (holle plint) from the same mortar, as in the photos from our kitchen project.": "Met een troffelvloer kunnen we ook afschot naar putten en goten maken zonder extra dekvloer. Holle plinten zetten we in dezelfde mortel, zoals op de foto's van ons keukenproject.", "Composition": "Samenstelling", "EP resin + quartz sand": "EP-hars + kwartszand", "Compressive strength": "Druksterkte", "very high (> 60 N/mm², per system)": "zeer hoog (> 60 N/mm², per systeem)", "after approx. 24–48 h": "na ca. 24–48 uur", "Falls to drains": "Afschot naar putten", "yes, in one layer": "ja, in één laag", "Hygiene": "Hygiëne", "seamless, coved skirting, HACCP": "naadloos, holle plint, HACCP", "Commercial kitchens and catering": "Grootkeukens en horeca", "Food production": "Voedselproductie", "Halls with forklift traffic": "Hallen met heftruckverkeer", "Workshops and wash bays": "Werkplaatsen en wasplaatsen", "Wet rooms": "Natte ruimtes", "EP pore sealer": "EP-poriënsealer", "EP + quartz mortar, trowelled": "EP + kwartsmortel, getroffeld", "Concrete (blasted / milled)": "Beton (gestraald / gefreesd)", "Large-format surfaces": "Grote oppervlakken", "Halls · warehouses · kitchens": "Hallen · magazijnen · keukens", "End to end: from grinding and substrate preparation to a finished floor across thousands of m².": "Compleet: van schuren en voorbereiden van de ondergrond tot een afgewerkte vloer over duizenden m².", "A large project is won in substrate preparation. We diamond-grind, shot-blast or mill the concrete, remove old coatings and repair cracks and voids before the system goes down. Always with dust extraction.": "Een groot project wordt gewonnen in de voorbereiding. We schuren het beton met diamant, stralen of frezen het, verwijderen oude coatings en herstellen scheuren en gaten voordat het systeem erop gaat. Altijd met stofafzuiging.", "We work in live buildings: we split the hall into phases, agree night and weekend work windows with the facility manager and hand over zone by zone. Every phase has a record: CM moisture, pull-off strength, temperature and dew point, layer thickness.": "We werken in panden die in gebruik zijn: we delen de hal op in fases, spreken met de facilitair manager nacht- en weekendvensters af en leveren zone voor zone op. Elke fase krijgt een verslag: CM-vocht, hechttreksterkte, temperatuur en dauwpunt, laagdikte.", "We match the system to the load: self-levelling epoxy for warehouses, troffelvloer for kitchens and production, PU-cement where there is hot water and chemicals. We also detail movement joints, safety lines and traffic-route marking.": "We stemmen het systeem af op de belasting: zelfnivellerende epoxy voor magazijnen, troffelvloer voor keukens en productie, PU-cement waar heet water en chemicaliën zijn. Ook dilatatievoegen, veiligheidslijnen en looproutemarkering werken we uit.", "Diamond grinding and shot blasting with dust extraction": "Diamantschuren en kogelstralen met stofafzuiging", "Repair of cracks, voids and joints": "Herstel van scheuren, gaten en voegen", "CM, pull-off and dew-point measurement with a record": "CM-, hechttrek- en dauwpuntmeting met verslag", "Phasing in live buildings": "Gefaseerd werken in panden in gebruik", "Safety lines and zone marking": "Veiligheidslijnen en zonemarkering", "Balconies, terraces and galleries": "Balkons, terrassen en galerijen", "Residential · VvE": "Woningbouw · VvE", "Watertight, slip-resistant PMMA coatings for balconies and galleries. Fast, clean, without long closures.": "Waterdichte, slipvaste PMMA-coatings voor balkons en galerijen. Snel, schoon en zonder lange afsluiting.", "Balconies and galleries in the Netherlands work in rain, frost and sun. Leaks into the flats below and corroded reinforcement are the most common problems VvEs and property managers bring to us. We solve them with seamless PMMA waterproofing finished with coloured quartz.": "Balkons en galerijen in Nederland staan in regen, vorst en zon. Lekkage naar de woningen eronder en gecorrodeerde wapening zijn de meest voorkomende problemen waarmee VvE's en beheerders bij ons komen. We lossen ze op met naadloze PMMA-waterdichting, afgewerkt met gekleurd kwarts.", "On galleries we work in sections and always leave a walkway to front doors. Residents receive a letter with the schedule in advance. PMMA cures in an hour, so even in autumn weather we close a section the same day.": "Op galerijen werken we in secties en laten we altijd een looppad naar de voordeuren vrij. Bewoners krijgen vooraf een brief met de planning. PMMA hardt in een uur uit, dus zelfs bij herfstweer sluiten we een sectie dezelfde dag af.", "Details decide watertightness: balcony door thresholds, balustrade posts, drains, gutters and slab edges. We form them in the same system, reinforced with fleece. Colour separation lines are taped and cut precisely, as in the photos of our projects.": "Details bepalen de waterdichtheid: dorpels van balkondeuren, balusterstaanders, afvoeren, goten en plaatranden. We maken ze in hetzelfde systeem, versterkt met vlies. Kleurscheidingslijnen worden strak afgeplakt en gesneden, zoals op de foto's van onze projecten.", "PMMA waterproofing with fleece": "PMMA-waterdichting met vlies", "Coloured-quartz or flake finish": "Afwerking met gekleurd kwarts of flakes", "Slip resistance R10–R12": "Slipweerstand R10–R12", "Sectional work with door access": "Werken in secties met toegang tot de deur", "Schedule and resident notices": "Planning en bewonersbrieven", "Garages and car parks": "Garages en parkeergarages", "Garages · ramps · car parks": "Garages · hellingbanen · parkeergarages", "Resistant to salt, oil and tyre marks. From a private garage to a multi-storey car park and outdoor ramp.": "Bestand tegen zout, olie en bandensporen. Van een privégarage tot een parkeergarage met meerdere lagen en een buitenhellingbaan.", "Road salt carried in on tyres is the biggest enemy of garage concrete. Chlorides penetrate and corrode the reinforcement. A sealed coating stops them at the surface and protects the structure for years.": "Strooizout dat via de banden binnenkomt is de grootste vijand van garagebeton. Chloriden dringen het beton in en tasten de wapening aan. Een gesloten coating houdt ze aan het oppervlak tegen en beschermt de constructie jarenlang.", "In underground garages we use epoxy systems with quartz broadcast; on open-air decks and ramps, elastic UV-stable PU or PMMA systems. Ramps receive coarser quartz for tyre grip, also in rain.": "In ondergrondse garages gebruiken we epoxysystemen met kwartsinstrooiing; op open parkeerdekken en hellingbanen elastische, UV-bestendige PU- of PMMA-systemen. Hellingbanen krijgen grover kwarts voor grip, ook bij regen.", "We finish with markings: bay lines, direction arrows, pedestrian crossings and protective kerbs, as on the ramp in our project. For private garages we recommend flake epoxy, which looks good and does not absorb oil.": "We werken af met markering: vakbelijning, richtingspijlen, voetgangersoversteken en schrikranden, zoals op de hellingbaan van ons project. Voor privégarages adviseren we epoxy met flakes: dat oogt goed en neemt geen olie op.", "Protection against chlorides and road salt": "Bescherming tegen chloriden en strooizout", "Elastic systems for decks and ramps": "Elastische systemen voor dekken en hellingbanen", "Coarse quartz on ramps (R12–R13)": "Grof kwarts op hellingbanen (R12–R13)", "Lines, arrows and markings": "Belijning, pijlen en markering", "Private garages with flakes": "Privégarages met flakes", "Balcony, PMMA with coloured quartz": "Balkon, PMMA met gekleurd kwarts", "Gallery in progress, colour line": "Galerij in uitvoering, kleurlijn", "Commercial kitchen, troffelvloer": "Grootkeuken, troffelvloer", "Residential gallery after renovation": "Woongalerij na renovatie", "Car park ramp with kerb": "Hellingbaan parkeergarage met schrikrand", "Flakes and coved skirting": "Flakes en holle plint", "Balcony, slip-resistant coating": "Balkon, slipvaste coating", "Garage entrance, markings": "Garage-inrit, markering", "Gallery at front doors": "Galerij bij de voordeuren", "Technical corridor, epoxy": "Technische gang, epoxy", "Inspection & measurement": "Inspectie & meting", "We visit the site, assess the concrete and take measurements. On that basis we prepare a quotation with the chosen system.": "We komen langs, beoordelen het beton en voeren metingen uit. Op basis daarvan maken we een offerte met het gekozen systeem.", "CM moisture": "CM-vocht", "dew point": "dauwpunt", "Substrate preparation": "Voorbereiding ondergrond", "Diamond grinding, shot blasting or milling to an open, sound surface.": "Diamantschuren, kogelstralen of frezen tot een open, draagkrachtig oppervlak.", "old coating removal": "verwijderen oude coatings", "dust extraction": "stofafzuiging", "Repair & primer": "Herstel & primer", "We fill cracks and voids, level and apply a primer matched to the system.": "We vullen scheuren en gaten, egaliseren en brengen een primer aan die past bij het systeem.", "cracks, joints": "scheuren, voegen", "primer + broadcast": "primer + instrooiing", "System application": "Aanbrengen systeem", "We pour and spread base layers, broadcast and topcoat, checking thickness as we go.": "We gieten en verdelen de basislagen, de instrooiing en de toplaag en controleren de laagdikte tijdens het werk.", "thickness control": "laagdiktecontrole", "temp. +3 K above dew point": "temp. +3 K boven dauwpunt", "Handover & warranty": "Oplevering & garantie", "Final check, handover record, maintenance guide and written warranty terms.": "Eindcontrole, opleverrapport, onderhoudsadvies en schriftelijke garantievoorwaarden.", "handover report (opleverrapport)": "opleverrapport", "maintenance advice": "onderhoudsadvies", "Synthetic resin screeds": "Kunstharsgebonden vloeren", "Classification of synthetic resin floors (SR) for bond strength, wear and impact resistance. We describe the performance of our epoxy and troffelvloer systems to this standard.": "Classificatie van kunstharsvloeren (SR) op hechtsterkte, slijtvastheid en slagvastheid. Volgens deze norm beschrijven we de prestaties van onze epoxy- en troffelvloersystemen.", "Surface protection of concrete": "Oppervlaktebescherming van beton", "The standard for systems protecting concrete against water, chlorides and CO₂. It applies to coatings on car parks, balconies and galleries.": "De norm voor systemen die beton beschermen tegen water, chloriden en CO₂. Van toepassing op coatings in parkeergarages, op balkons en galerijen.", "Liquid-applied waterproofing": "Vloeibaar aangebrachte waterdichting", "European technical assessment for liquid membranes such as PMMA on balconies and terraces. We use systems that carry such an approval.": "Europese technische beoordeling voor vloeibare membranen zoals PMMA op balkons en terrassen. We werken met systemen die zo'n goedkeuring hebben.", "Classes R9–R13 describe slip resistance in footwear. We match the class to the zone: kitchen, ramp, balcony, warehouse.": "De klassen R9–R13 beschrijven de slipweerstand met schoeisel. We kiezen de klasse per zone: keuken, hellingbaan, balkon, magazijn.", "Besluit bouwwerken leefomgeving": "Besluit bouwwerken leefomgeving", "Replaced the Bouwbesluit in 2024. We take its safety-in-use requirements into account, for example on galleries and escape routes.": "Vervangt sinds 2024 het Bouwbesluit. We houden rekening met de eisen voor gebruiksveiligheid, bijvoorbeeld op galerijen en vluchtroutes.", "Food-zone hygiene": "Hygiëne in voedselzones", "Seamless floors with coved skirting (holle plint), easy to clean and disinfect, for kitchens and food plants.": "Naadloze vloeren met holle plint, eenvoudig te reinigen en te desinfecteren, voor keukens en voedingsbedrijven.", "Health & safety": "Veiligheid & gezondheid", "We work in line with the Arbowet and VCA rules: protective equipment, ventilation, marked work zones and safe handling of resins.": "We werken volgens de Arbowet en de VCA-regels: beschermingsmiddelen, ventilatie, afgezette werkzones en veilig werken met harsen.", "Measurements": "Metingen", "Quality record": "Kwaliteitsverslag", "CM moisture (cementitious approx. ≤ 4 %), pull-off ≥ 1.5 N/mm², substrate at least 3 K above dew point, air humidity and layer thickness.": "CM-vocht (cementgebonden ca. ≤ 4 %), hechttrek ≥ 1,5 N/mm², ondergrond minimaal 3 K boven het dauwpunt, luchtvochtigheid en laagdikte.", "Which system: PMMA, epoxy or PU?": "Welk systeem: PMMA, epoxy of PU?", "Outdoors and where time matters (balconies, galleries), usually PMMA. Inside halls and warehouses, epoxy. For car parks and structures that move, elastic PU. For kitchens and production, troffelvloer or PU-cement. We make the final choice after on-site measurements.": "Buiten en waar tijd telt (balkons, galerijen) meestal PMMA. In hallen en magazijnen epoxy. Voor parkeergarages en constructies die bewegen elastisch PU. Voor keukens en productie een troffelvloer of PU-cement. De definitieve keuze maken we na metingen op locatie.", "How long does it take?": "Hoe lang duurt het?", "A balcony or gallery section in PMMA: usually one day. A private garage: 2–3 days. A hall of several thousand m²: from a few days to a few weeks, in phases. The exact schedule is in the quotation.": "Een balkon of galerijsectie in PMMA: meestal één dag. Een privégarage: 2–3 dagen. Een hal van enkele duizenden m²: van enkele dagen tot enkele weken, in fases. De exacte planning staat in de offerte.", "Can you work in low temperatures?": "Kunnen jullie werken bij lage temperaturen?", "PMMA yes, from approx. 0 °C substrate temperature. Epoxy and PU usually need at least 10 °C and a substrate at least 3 K above the dew point. We check this with an instrument before every layer.": "PMMA wel, vanaf een ondergrondtemperatuur van ca. 0 °C. Epoxy en PU hebben meestal minimaal 10 °C nodig en een ondergrond die minstens 3 K boven het dauwpunt ligt. We meten dit vóór elke laag.", "Is the work dusty or disruptive?": "Geeft het werk veel stof of overlast?", "We grind and blast with industrial dust extraction, so there is little dust. Resins smell during application, so we provide ventilation and inform building users.": "We schuren en stralen met industriële stofafzuiging, dus er komt weinig stof vrij. Harsen ruiken tijdens het aanbrengen; daarom zorgen we voor ventilatie en informeren we de gebruikers van het gebouw.", "Do you give a warranty?": "Geven jullie garantie?", "Yes. Warranty terms and period are written into the quotation for the specific system and substrate. They are based on the measurement records taken before work.": "Ja. De garantievoorwaarden en -termijn leggen we vast in de offerte, per systeem en ondergrond. Ze zijn gebaseerd op de meetverslagen van vóór de werkzaamheden.", "Do you work for VvEs and property managers?": "Werken jullie voor VvE's en beheerders?", "Yes, it is a large part of our balcony and gallery work. We prepare a quotation the VvE board can follow, a schedule and resident letters.": "Ja, dat is een groot deel van ons werk aan balkons en galerijen. We maken een offerte die het VvE-bestuur goed kan volgen, een planning en bewonersbrieven.", "How do I maintain a resin floor?": "Hoe onderhoud ik een kunstharsvloer?", "Day to day, cleaning with a neutral detergent (pH 7–9) and a soft brush or scrubber is enough. At handover we give a maintenance guide matched to the system.": "Dagelijks reinigen met een neutraal middel (pH 7–9) en een zachte borstel of schrobmachine is voldoende. Bij de oplevering krijgt u een onderhoudsadvies dat past bij het systeem.", "Which region do you cover?": "In welke regio werken jullie?", "The whole of the Netherlands. For large projects also Belgium and Germany by arrangement.": "In heel Nederland. Voor grote projecten in overleg ook in België en Duitsland.", "Free inspection": "Gratis inspectie", "Tell us about your surface. We reply with a plan and a quote.": "Vertel ons over uw oppervlak. U krijgt een plan en een offerte.", "We visit, measure and advise a system. Quotation (offerte) within a few working days.": "We komen langs, meten en adviseren een systeem. Offerte binnen enkele werkdagen.", "Request a quote": "Offerte aanvragen", "Home": "Home", "Concrete protection · since 2016": "Betonbescherming · sinds 2016", "Concrete that <em>outlasts</em> everything.": "Beton dat <em>alles</em> doorstaat.", "Seamless PMMA, epoxy and polyurethane coatings and troffelvloer. From halls of thousands of m² to balconies, galleries and garages, across the Netherlands.": "Naadloze PMMA-, epoxy- en polyurethaancoatings en troffelvloeren. Van hallen van duizenden m² tot balkons, galerijen en garages, in heel Nederland.", "See our work": "Bekijk ons werk", "Pour": "Gieten", "Spread": "Verdelen", "Broadcast": "Instrooien", "Seal": "Afsluiten", "years of experience in the Netherlands": "jaar ervaring in Nederland", "systems: PMMA, EP, PU, troffel": "systemen: PMMA, EP, PU, troffel", "PMMA cure on a balcony": "uitharding PMMA op een balkon", "work to NEN-EN standards": "werk volgens NEN-EN-normen", "Systems": "Systemen", "Four chemistries. One rule: match the substrate and the load.": "Vier chemieën. Eén regel: afgestemd op ondergrond en belasting.", "We do not sell one resin for everything. Each system has different strengths, and we choose after measuring on site.": "We verkopen niet één hars voor alles. Elk systeem heeft andere sterke punten, en we kiezen pas na metingen op locatie.", "Details": "Details", "System cross-section": "Doorsnede van het systeem", "Protection is built layer by layer.": "Bescherming wordt laag voor laag opgebouwd.", "Every layer has a job: the primer bonds to the concrete, the membrane seals, the broadcast gives grip and the topcoat protects against UV, chemicals and wear.": "Elke laag heeft een taak: de primer hecht aan het beton, het membraan dicht af, de instrooiing geeft grip en de toplaag beschermt tegen UV, chemicaliën en slijtage.", "typical thicknesses, not to scale": "gangbare laagdiktes, niet op schaal", "Applications": "Toepassingen", "From thousands of metres to a single balcony.": "Van duizenden meters tot één balkon.", "We do large surfaces end to end, with grinding and substrate preparation. Small ones with the same care, and fast.": "Grote oppervlakken doen we compleet, inclusief schuren en voorbereiden van de ondergrond. Kleine met dezelfde zorg, en snel.", "Werkwijze": "Werkwijze", "Five stages. Each one recorded.": "Vijf stappen. Elke stap vastgelegd.", "Most of a coating’s life is decided in preparation. That is why we measure before we pour anything.": "De levensduur van een coating wordt grotendeels bepaald in de voorbereiding. Daarom meten we voordat we ook maar iets gieten.", "Full process": "Volledige werkwijze", "About us": "Over ons", "Ten years, hundreds of balconies and halls. <b>No shortcuts</b> in substrate preparation.": "Tien jaar, honderden balkons en hallen. <b>Geen concessies</b> bij de voorbereiding van de ondergrond.", "Premium CoatUp is a team of resin-flooring specialists working in the Netherlands since 2016. We work for companies, VvEs, property managers and private clients.": "Premium CoatUp is een team van specialisten in kunstharsvloeren, sinds 2016 actief in Nederland. We werken voor bedrijven, VvE's, vastgoedbeheerders en particulieren.", "Meet us": "Maak kennis", "Our specialist at work on a gallery": "Onze specialist aan het werk op een galerij", "Services": "Diensten", "Systems and applications": "Systemen en toepassingen", "Choose a system by chemistry, or by the place you want to protect.": "Kies een systeem op basis van de chemie, of op basis van de plek die u wilt beschermen.", "By system": "Per systeem", "The chemistries we work with": "De chemieën waarmee we werken", "By location": "Per locatie", "Where we work": "Waar we werken", "Comparison": "Vergelijking", "Systems side by side": "Systemen naast elkaar", "Typical values. Exact performance depends on product and substrate.": "Gangbare waarden. De exacte prestaties hangen af van product en ondergrond.", "Curing": "Uitharding", "~1 h": "~1 uur", "Outdoor / UV": "Buiten / UV", "with PU topcoat": "met PU-toplaag", "indoor": "binnen", "Elasticity": "Elasticiteit", "high": "hoog", "low": "laag", "Mechanical load": "Mechanische belasting", "medium": "gemiddeld", "medium–high": "gemiddeld–hoog", "Slip": "Slip", "System": "Systeem", "What it is and when we use it": "Wat het is en wanneer we het toepassen", "Datasheet": "Technische gegevens", "Typical values; final figures per product datasheet and site conditions.": "Gangbare waarden; definitieve waarden volgens het productblad en de omstandigheden op locatie.", "Build-up": "Opbouw", "Layer build-up": "Laagopbouw", "From concrete to the wearing surface.": "Van beton tot slijtlaag.", "Typical uses": "Toepassingen", "Typical thicknesses, not to scale": "Gangbare laagdiktes, niet op schaal", "Other systems": "Andere systemen", "Compare with the others": "Vergelijk met de andere", "How we work": "Onze werkwijze", "Included": "Inbegrepen", "What the service covers": "Wat de dienst omvat", "Recommended systems": "Aanbevolen systemen", "Projects": "Projecten", "From our sites": "Van onze bouwplaatsen", "Balconies & galleries": "Balkons & galerijen", "Garages & car parks": "Garages & parkeergarages", "Industrial & kitchens": "Industrie & keukens", "Our projects": "Onze projecten", "Photos of work done by our team: galleries, balconies, car park ramps and commercial kitchens.": "Foto's van werk door ons team: galerijen, balkons, hellingbanen van parkeergarages en grootkeukens.", "All": "Alle", "A process in line with Dutch contracting practice: from measurements and substrate preparation to the handover report (opleverrapport).": "Een werkwijze volgens de Nederlandse aannemerspraktijk: van metingen en voorbereiding van de ondergrond tot het opleverrapport.", "Grinding, shot blasting, milling": "Schuren, stralen, frezen", "A coating is only as good as the concrete beneath it. We remove laitance, old paints and contamination, open the pores and check the strength.": "Een coating is zo goed als het beton eronder. We verwijderen cementhuid, oude verf en  {id:'troffel',code:'TR',img:9,

  short:L('Najmocniejszy system: 4–8 mm zaprawy epoksydowo-kwarcowej zacieranej mechanicznie. Do kuchni przemysłowych, produkcji i miejsc o dużym obciążeniu.','The toughest system: 4–8 mm of epoxy-quartz mortar, power-trowelled. For commercial kitchens, production and heavy-duty areas.'),

function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function grains(g,w,h,r,n,rmin,rmax,pal,relief){for(let i=0;i<n;i++){const x=r()*w,y=r()*h,s=rmin+r()*(rmax-rmin);if(relief){g.fillStyle='rgba(0,0,0,.35)';g.beginPath();g.arc(x+s*.45,y+s*.45,s,0,7);g.fill();}g.fillStyle=pal[(r()*pal.length)|0];g.beginPath();g.arc(x,y,s,0,7);g.fill();if(relief&&s>1.2){g.fillStyle='rgba(255,255,255,.35)';g.beginPath();g.arc(x-s*.3,y-s*.3,s*.35,0,7);g.fill();}}}
function speck(g,w,h,r,n,a){for(let i=0;i<n;i++){const v=(r()*255)|0;g.fillStyle=`rgba(${v},${v},${v},${r()*a})`;g.fillRect(r()*w,r()*h,1+r()*1.5,1+r()*1.5);}}
function stones(g,w,h,r,n,smin,smax,pal){for(let i=0;i<n;i++){const x=r()*w,y=r()*h,s=smin+r()*(smax-smin),k=5+((r()*4)|0);g.fillStyle=pal[(r()*pal.length)|0];g.beginPath();for(let j=0;j<k;j++){const a=j/k*6.283,rr=s*(.7+r()*.5);g.lineTo(x+Math.cos(a)*rr*1.2,y+Math.sin(a)*rr);}g.closePath();g.fill();g.strokeStyle='rgba(0,0,0,.25)';g.lineWidth=.8;g.stroke();}}
function pores(g,w,h,r,n){for(let i=0;i<n;i++){const x=r()*w,y=r()*h,s=.6+r()*2.2;g.fillStyle='rgba(20,20,22,.7)';g.beginPath();g.arc(x,y,s,0,7);g.fill();g.strokeStyle='rgba(255,255,255,.12)';g.lineWidth=.6;g.beginPath();g.arc(x+.4,y+.4,s+.4,0,7);g.stroke();}}
function sheen(g,w,h,a){const gr=g.createLinearGradient(0,0,w,h);gr.addColorStop(0,`rgba(255,255,255,${a})`);gr.addColorStop(.35,'rgba(255,255,255,0)');gr.addColorStop(.62,'rgba(255,255,255,0)');gr.addColorStop(.75,`rgba(255,255,255,${a*.6})`);gr.addColorStop(.85,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(0,0,w,h);}

  const rs=g.createLinearGradient(-R1,0,R1,0);rs.addColorStop(0,'#8f9396');rs.addColorStop(.5,'#c3c7c9');rs.addColorStop(1,'#8a8e91');
  g.fillStyle=rs;g.beginPath();g.ellipse(0,-BH/2,R1-3,12,0,0,Math.PI*2);g.fill();
  g.fillStyle='rgba(255,255,255,.55)';g.beginPath();g.ellipse(-20,-BH/2-3,26,3,0,0,Math.PI*2);g.fill();
  /* handle */g.strokeStyle='#5d6063';g.lineWidth=4;g.beginPath();g.arc(0,-BH/2+8,R1+10,Math.PI*.05,Math.PI*.95);g.stroke();
  /* lip point */const pts=[[-R1,-BH/2],[R1,-BH/2]].map(([x,y])=>[W/2+x*Math.cos(th)-y*Math.sin(th),H/2+x*Math.sin(th)+y*Math.cos(th)]);
  const lip=pts[0][1]>pts[1][1]?pts[0]:pts[1];

 }
 function pole(){const [c,g]=cvs(16,512);const gr=g.createLinearGradient(0,0,16,0);gr.addColorStop(0,'#3a3d40');gr.addColorStop(.35,'#d8dadb');gr.addColorStop(.6,'#8b8f92');gr.addColorStop(1,'#2c2e30');g.fillStyle=gr;g.fillRect(0,0,16,512);g.fillStyle='#16181a';g.fillRect(0,0,16,90);return c.toDataURL('image/png');}
 let B=null;
 function build(){
  B=bucket();
  root=document.createElement('div');root.className='hs';
  root.innerHTML=`<div class="hs-stage" id="hs-stage">
   <div class="hs-shadow"></div>
   <div class="hs-slab">
    <div class="hs-f hs-top" style="background-image:url(${concTop()})"></div>
    <div class="hs-f hs-fr" style="background-image:url(${concSide(11)})"><div class="hs-cfr"></div></div>
    <div class="hs-f hs-lf" style="background-image:url(${concSide(23,true)})"><div class="hs-clf"></div></div>
    <div class="hs-coatplane">
     <div class="hs-coat"><div class="hs-fill" style="background-image:url(${resin()})"><div class="hs-flakes" style="background-image:url(${flakes()})"></div><div class="hs-shine"></div></div></div>
     <div class="hs-wave"></div>
     <div class="hs-ripple"></div><div class="hs-ripple d2"></div>
     <div class="hs-mk"></div>
     <div class="hs-drops"></div>
     <div class="hs-sq"><div class="sq-f sq-top"></div><div class="sq-f sq-lf"></div><div class="sq-f sq-fr"></div><div class="sq-pole" style="background-image:url(${pole()})"></div></div>
    </div>
   </div></div>
   <img class="hs-bucket" alt="" src="${B.url}" width="${B.w}" height="${B.h}">
   <div class="hs-stream"><i></i></div>`;
 }
 const cl=(x,a,b)=>Math.min(1,Math.max(0,(x-a)/(b-a))), ease=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
 function frame(now){
  raf=requestAnimationFrame(frame);
  const k=window.__heroT!=null?window.__heroT:reduce?.93:((now-t0)%CYCLE)/CYCLE;
  const cyc=Math.floor((now-t0)/CYCLE);
  const pour=cl(k,.06,.37),spread=ease(cl(k,.42,.70)),fl=cl(k,.71,.84),gl=cl(k,.84,.97),fade=1-cl(k,.975,1);
  const st=root.querySelector('#hs-stage');
  st.style.setProperty('--rx',(my*-6)+'deg');st.style.setProperty('--rz',(mx*10)+'deg');
  /* puddle: three overlapping lobes for an organic edge */
  const pr=Math.pow(pour,.65), sx=spread>0?(spread*104-2):-5;
  const lobe=(cx,cy,rx,ry)=>`radial-gradient(${(rx*pr).toFixed(2)}% ${(ry*pr).toFixed(2)}% at ${cx}% ${cy}%,#000 96%,transparent 100%)`;
  const m=[lobe(27,47,19,27),lobe(33,40,13,19),lobe(21,55,12,17),lobe(30,56,10,14),`linear-gradient(90deg,#000 ${sx.toFixed(2)}%,transparent ${(sx+.4).toFixed(2)}%)`].join(',');
  const fill=root.querySelector('.hs-fill');fill.style.webkitMaskImage=fill.style.maskImage=pr>0||sx>0?m:'linear-gradient(transparent,transparent)';
  root.querySelector('.hs-coat').style.opacity=fade;
  root.querySelector('.hs-flakes').style.opacity=(fl*fade).toFixed(3);
  root.querySelector('.hs-shine').style.setProperty('--gp',(130-gl*260)+'%');
  root.querySelector('.hs-shine').style.opacity=(gl>0&&gl<1?1:0);
  fill.style.setProperty('--wet',(1-cl(k,.70,.9)).toFixed(3));
  /* coat edges on slab faces */
  root.querySelector('.hs-cfr').style.clipPath=`inset(0 ${Math.max(0,100-sx).toFixed(2)}% 0 0)`;root.querySelector('.hs-cfr').style.opacity=fade;
  root.querySelector('.hs-clf').style.opacity=(sx>0?1:0)*fade;
  /* bow wave in front of the squeegee */
  const wv=root.querySelector('.hs-wave');wv.style.left=sx+'%';wv.style.opacity=(spread>0&&spread<1)?1:0;
  /* squeegee */
  const sqIn=cl(k,.37,.42),sqOut=cl(k,.70,.75),sq=root.querySelector('.hs-sq');
  sq.style.opacity=k>.36&&k<.76?1:0;
  sq.style.left=Math.max(-2,sx)+'%';sq.style.transform=`translateZ(${((1-ease(sqIn))*160+ease(sqOut)*200).toFixed(1)}px)`;
  /* ripples while pouring */
  root.querySelectorAll('.hs-ripple').forEach(r=>r.style.visibility=pour>0&&pour<1?'visible':'hidden');
  /* flakes rain once per cycle */
  if(fl>0&&fl<1&&flCycle!==cyc&&window.__heroT==null){flCycle=cyc;const d=root.querySelector('.hs-drops');d.innerHTML='';for(let i=0;i<110;i++){const s=document.createElement('span');s.style.cssText=`left:${3+Math.random()*94}%;top:${3+Math.random()*94}%;animation-delay:${Math.random()*1400}ms`;d.appendChild(s);}}
  if(k<.7)root.querySelector('.hs-drops').innerHTML='';
  /* bucket + stream (2D, aligned to the projected pour point) */
  const bk=root.querySelector('.hs-bucket'),sm=root.querySelector('.hs-stream'),mk=root.querySelector('.hs-mk');
  const host=el.getBoundingClientRect(),p=mk.getBoundingClientRect();const px=p.left-host.left,py=p.top-host.top;
  const bin=cl(k,0,.06),bout=cl(k,.37,.43),sH=host.width<700?105:Math.min(200,Math.max(110,host.height*.22));
  const lx=px,ly=py-sH-(1-ease(bin))*120-ease(bout)*180;
  const bs=host.width<700?.55:host.width<1100?.75:1;bk.style.transform=`translate(${(lx-B.lip[0]+(1-ease(bin))*80+ease(bout)*60).toFixed(1)}px,${(ly-B.lip[1]).toFixed(1)}px) rotate(${(-(1-ease(bin))*18+ease(bout)*20).toFixed(1)}deg) scale(${bs})`;
  bk.style.transformOrigin=`${B.lip[0]}px ${B.lip[1]}px`;
  bk.style.opacity=k<.44?Math.min(1,bin*3)*(1-bout):0;
  const sOn=k>.06&&k<.37;const thin=1-cl(k,.31,.37);
  sm.style.opacity=sOn?1:0;sm.style.left=px+'px';sm.style.top=(py-sH)+'px';sm.style.height=sH+'px';sm.style.setProperty('--sw',(4+thin*7).toFixed(1)+'px');
  /* phase labels */
  const pb=document.getElementById('phase-bar');if(pb)pb.style.width=(k*100).toFixed(1)+'%';
  const ph=k<.38?0:k<.70?1:k<.84?2:3;
  if(ph!==last){last=ph;document.querySelectorAll('#phase li').forEach(s=>{s.classList.toggle('on',+s.dataset.p===ph);s.classList.toggle('done',+s.dataset.p<ph);});}
 }
 addEventListener('pointermove',e=>{mx=e.clientX/innerWidth-.5;my=e.clientY/innerHeight-.5;});
 return{
  mount(container){if(!container)return;try{if(!root)build();}catch(e){return;}
   el=container;el.appendChild(root);const fb=el.parentNode.querySelector('.hero-fallback');if(fb)fb.style.display='none';last=-1;
   if(!raf)raf=requestAnimationFrame(frame);},
  unmount(){if(raf)cancelAnimationFrame(raf);raf=null;el=null;}
 };
})();

document.addEventListener('visibilitychange',()=>{if(document.hidden)Hero.unmount();else if(current()==='home')Hero.mount(document.getElementById('hero3d'));});
render(false);
})();
