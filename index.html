<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Premium CoatUp – naadloze PMMA-, epoxy- en PU-coatings en troffelvloeren voor balkons, galerijen, garages en bedrijfshallen in heel Nederland. Sinds 2016.">
<meta name="theme-color" content="#0a0c0e">
<link rel="icon" type="image/png" href="img/logo-sm.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Premium CoatUp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400;500;600;700&family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: one continuous graphite ground (deliberately dark-only, like fresh resin), floating glass navigation, rounded bento surfaces, champagne-gold accent. */
:root{
  --bg:#0a0c0e; --bg-2:#111417; --glass:rgba(255,255,255,.04); --glass-2:rgba(255,255,255,.075);
  --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.16);
  --fg:#f3f2ef; --muted:#9aa0a5; --dim:#62686d;
  --gold:#e4c792; --gold-2:#b88c4d; --gold-ink:#17120a;
  --grad:linear-gradient(135deg,#f4e2bb 0%,#d6ab6a 45%,#9b733a 100%);
  --f-d:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-b:"Geist","Helvetica Neue",Arial,sans-serif;
  --f-m:"Geist Mono",ui-monospace,Menlo,Consolas,monospace;
  --gut:clamp(16px,4vw,48px); --max:1280px; --r:28px; --r-s:16px;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth;background:var(--bg)}
body{background:var(--bg);color:var(--fg);font:400 16px/1.6 var(--f-b);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit}
img{display:block;max-width:100%}
::selection{background:var(--gold);color:var(--gold-ink)}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:8px}

/* ambient light + grain, shared by every section so transitions stay seamless */
.ambient{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
  radial-gradient(60vw 50vh at 85% 8%,rgba(214,171,106,.10),transparent 60%),
  radial-gradient(50vw 60vh at 0% 60%,rgba(120,140,160,.08),transparent 60%),
  radial-gradient(40vw 40vh at 70% 100%,rgba(214,171,106,.06),transparent 60%),var(--bg)}
.grain{position:fixed;inset:-50%;z-index:100;pointer-events:none;opacity:.05;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}

.wrap{max-width:var(--max);margin-inline:auto;padding-inline:var(--gut)}
section{padding-block:clamp(72px,10vw,140px)}
h1,h2,h3,h4{margin:0;font-family:var(--f-d);font-weight:500;text-wrap:balance;letter-spacing:-.035em}
h1{font-size:clamp(2.6rem,7.4vw,7.2rem);line-height:.95;font-weight:500}
h2{font-size:clamp(2rem,4.6vw,4.1rem);line-height:1.02}
h3{font-size:clamp(1.15rem,1.7vw,1.45rem);line-height:1.15;letter-spacing:-.02em}
p{margin:0;max-width:64ch}
.gt{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{font-size:clamp(1.05rem,1.35vw,1.22rem);color:var(--muted);line-height:1.6;font-weight:300}
.muted{color:var(--muted)}
.mono{font-family:var(--f-m);font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:22px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.kicker{display:inline-flex;align-self:flex-start;align-items:center;gap:9px;padding:7px 14px 7px 11px;border:1px solid var(--line);border-radius:999px;background:var(--glass);font:500 .7rem/1 var(--f-m);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.kicker::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 4px rgba(228,199,146,.15),0 0 14px var(--gold)}

/* buttons */
.btn{position:relative;display:inline-flex;align-items:center;gap:12px;padding:8px 8px 8px 22px;min-height:52px;border-radius:999px;font:500 .95rem/1 var(--f-b);text-decoration:none;border:1px solid transparent;cursor:pointer;overflow:hidden;transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s,background .35s;white-space:nowrap}
.btn .ic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.btn:hover .ic{transform:rotate(-45deg)}
.btn-gold{background:var(--grad);color:var(--gold-ink);box-shadow:0 12px 34px -12px rgba(214,171,106,.7),inset 0 1px 0 rgba(255,255,255,.55)}
.btn-gold .ic{background:var(--gold-ink);color:var(--gold)}
.btn-gold::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);transform:translateX(-120%);transition:transform .9s}
.btn-gold:hover::after{transform:translateX(120%)}
.btn-gold:hover{transform:translateY(-2px);box-shadow:0 18px 44px -12px rgba(214,171,106,.85),inset 0 1px 0 rgba(255,255,255,.55)}
.btn-glass{background:var(--glass-2);border-color:var(--line-2);color:var(--fg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.btn-glass .ic{background:rgba(255,255,255,.1)}
.btn-glass:hover{background:rgba(255,255,255,.12)}
.btn.sm{min-height:44px;padding:5px 5px 5px 18px;font-size:.88rem}
.btn.sm .ic{width:32px;height:32px}
.btn.plain{padding:0 22px}

/* nav */
.nav-shell{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:12px;right:12px;z-index:60;display:flex;justify-content:center;pointer-events:none}
.nav-in{pointer-events:auto;width:100%;max-width:1320px;display:flex;align-items:center;gap:14px;padding:7px 7px 7px 16px;border-radius:999px;background:rgba(14,16,19,.58);backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%);border:1px solid var(--line);box-shadow:0 18px 50px -18px rgba(0,0,0,.7);transition:background .4s}
.scrolled .nav-in{background:rgba(12,14,16,.82)}
.logo{display:flex;align-items:center;flex-shrink:0}
.logo img{height:40px;width:auto}
.nav{display:flex;gap:2px;margin-inline:auto;align-items:center}
.nav>a,.dd>button{font:450 .9rem/1 var(--f-b);text-decoration:none;padding:11px 14px;border-radius:999px;background:none;border:0;color:rgba(243,242,239,.8);cursor:pointer;display:flex;gap:6px;align-items:center;transition:background .25s,color .25s}
.nav>a:hover,.dd>button:hover,.dd>button[aria-expanded="true"]{background:var(--glass-2);color:var(--fg)}
.nav a[aria-current="page"]{color:var(--fg);background:var(--glass-2)}
.dd{position:relative}
.mega{position:absolute;top:calc(100% + 16px);left:50%;transform:translateX(-50%);width:min(860px,92vw);padding:14px;border-radius:24px;background:rgba(16,18,21,.94);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--line);box-shadow:0 40px 80px -30px rgba(0,0,0,.8);display:grid;grid-template-columns:1fr 1.15fr;gap:14px;animation:pop .35s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{from{transform:translateX(-50%) translateY(-6px) scale(.98)}to{transform:translateX(-50%)}}
.mega h5{margin:6px 8px 10px;font:500 .66rem/1 var(--f-m);letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.mega .sysl{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mega .sysl a{display:flex;flex-direction:column;gap:4px;padding:14px;border-radius:16px;background:var(--glass);border:1px solid var(--line);text-decoration:none;transition:border-color .25s,background .25s}
.mega .sysl a:hover{border-color:rgba(228,199,146,.4);background:rgba(228,199,146,.06)}
.mega .sysl b{font:600 1.1rem/1 var(--f-d)}
.mega .sysl span{font-size:.78rem;color:var(--muted);line-height:1.3}
.mega .appl a{display:grid;grid-template-columns:76px 1fr;gap:14px;align-items:center;padding:8px;border-radius:16px;text-decoration:none;transition:background .25s}
.mega .appl a:hover{background:var(--glass-2)}
.mega .appl img{width:76px;height:56px;object-fit:cover;border-radius:12px}
.mega .appl b{display:block;font-weight:500;font-size:.95rem}
.mega .appl span{font-size:.78rem;color:var(--muted)}
.mega .all{display:block;margin:8px;font-size:.85rem;color:var(--gold);text-decoration:none}
.tools{display:flex;gap:8px;align-items:center}
.lang{display:flex;padding:3px;border-radius:999px;background:var(--glass);border:1px solid var(--line)}
.lang button{font:500 .7rem/1 var(--f-m);letter-spacing:.06em;padding:9px 10px;border-radius:999px;background:none;border:0;color:var(--muted);cursor:pointer;transition:all .25s}
.lang button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.burger{display:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--line-2);background:var(--glass-2);color:var(--fg);cursor:pointer;place-items:center}
.mnav{position:fixed;inset:0;z-index:55;background:rgba(9,10,12,.96);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);padding:calc(env(safe-area-inset-top,0px) + 92px) var(--gut) 40px;overflow:auto;display:flex;flex-direction:column;gap:4px}
.mnav a{font:500 1.6rem/1.15 var(--f-d);letter-spacing:-.03em;text-decoration:none;padding:12px 0;border-bottom:1px solid var(--line)}
.mnav a.sub{font:400 1rem/1 var(--f-b);letter-spacing:0;padding:11px 0 11px 18px;color:var(--muted)}
.mnav .btn{margin-top:22px;align-self:flex-start;font:500 .95rem/1 var(--f-b);border:0;padding:8px 8px 8px 22px}
@media (max-width:1140px){.nav,.tools .btn{display:none}.burger{display:grid}.tools{margin-left:auto}}

/* hero */
.hero{position:relative;min-height:min(96svh,920px);display:flex;align-items:flex-end;padding:150px 0 44px;overflow:hidden;isolation:isolate}
.hero-3d,.hero-fallback{position:absolute;inset:0;z-index:-2}
.hero-fallback{background-size:cover;background-position:center;filter:saturate(.7) brightness(.6)}

.hero::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(90deg,rgba(10,12,14,.92) 0%,rgba(10,12,14,.55) 40%,rgba(10,12,14,0) 70%),linear-gradient(0deg,var(--bg) 0%,rgba(10,12,14,0) 35%),linear-gradient(180deg,rgba(10,12,14,.7) 0%,rgba(10,12,14,0) 22%)}
.hero .wrap{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:40px;align-items:end}
.hero-copy{display:flex;flex-direction:column;gap:28px;min-width:0}
.hero h1{max-width:11ch}
.hero .lead{max-width:44ch;color:rgba(243,242,239,.72)}
.phase{width:300px;padding:18px;border-radius:22px;background:rgba(14,16,19,.5);border:1px solid var(--line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);display:flex;flex-direction:column;gap:14px}
.phase-top{display:flex;justify-content:space-between;align-items:center;font:500 .66rem/1 var(--f-m);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.live{display:flex;gap:7px;align-items:center;color:var(--gold)}
.live::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--gold);animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.25}}
.phase ol{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.phase li{display:flex;justify-content:space-between;font-size:.88rem;color:var(--dim);transition:color .4s}
.phase li span{font:400 .72rem/1.6 var(--f-m)}
.phase li.on{color:var(--fg)}
.phase li.done{color:var(--muted)}
.bar{height:3px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--grad)}
.scrollhint{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);width:22px;height:34px;border:1px solid var(--line-2);border-radius:12px}
.scrollhint::after{content:"";position:absolute;left:50%;top:7px;width:3px;height:7px;margin-left:-1.5px;border-radius:2px;background:var(--gold);animation:sh 1.8s infinite}
@keyframes sh{0%{transform:translateY(0)}60%{transform:translateY(10px);opacity:0}100%{opacity:0}}
@media (max-width:900px){.hero .wrap{grid-template-columns:1fr}.phase{width:100%}.scrollhint{display:none}
 .hero::before{background:linear-gradient(0deg,var(--bg) 0%,rgba(10,12,14,.85) 38%,rgba(10,12,14,0) 60%)}}

/* hero scene */
.hero-3d{overflow:hidden}
.hs{position:absolute;inset:0;perspective:2200px;perspective-origin:68% 28%}
.hs-stage{--sw:min(35vw,580px);--sd:calc(var(--sw) * .64);--th:clamp(48px,6vw,84px);position:absolute;right:max(5vw,40px);top:54%;width:var(--sw);height:var(--sd);margin-top:calc(var(--sd) / -2);transform-style:preserve-3d;transform:rotateX(calc(60deg + var(--rx,0deg))) rotateZ(calc(-32deg + var(--rz,0deg)));transition:transform .8s ease-out}
.hs-shadow{position:absolute;inset:-14%;background:radial-gradient(closest-side,rgba(0,0,0,.85),transparent);filter:blur(16px)}
.hs-slab{position:absolute;inset:0;transform-style:preserve-3d}
.hs-f{position:absolute;background-size:100% 100%}
.hs-top{inset:0;transform:translateZ(var(--th))}
.hs-fr{left:0;bottom:0;width:100%;height:var(--th);transform-origin:50% 100%;transform:rotateX(-90deg);filter:brightness(.8)}
.hs-lf{left:0;top:0;width:var(--sd);height:var(--th);transform-origin:0 0;transform:rotateZ(90deg) rotateX(90deg);filter:brightness(.56)}
.hs-cfr{position:absolute;left:0;top:0;width:100%;height:5px;background:linear-gradient(#d2d5d6,#9fa3a6)}
.hs-clf{position:absolute;left:0;bottom:0;width:100%;height:5px;background:linear-gradient(0deg,#d2d5d6,#9fa3a6)}
.hs-coatplane{position:absolute;inset:0;transform-style:preserve-3d;transform:translateZ(calc(var(--th) + 1.5px))}
.hs-coat{position:absolute;inset:0;filter:drop-shadow(-1px -1px 0 rgba(255,255,255,.5)) drop-shadow(2px 3px 2px rgba(0,0,0,.55))}
.hs-fill{position:absolute;inset:0;background-size:100% 100%;-webkit-mask-size:100% 100%;mask-size:100% 100%;overflow:hidden}
.hs-fill::before{content:"";position:absolute;inset:0;background:radial-gradient(55% 45% at 30% 38%,rgba(255,255,255,.42),transparent 70%),radial-gradient(30% 25% at 70% 70%,rgba(255,255,255,.12),transparent 70%);opacity:calc(.35 + var(--wet,1) * .65)}
.hs-flakes{position:absolute;inset:0;background-size:100% 100%;opacity:0}
.hs-shine{position:absolute;inset:0;background:linear-gradient(110deg,transparent 42%,rgba(255,255,255,.6) 50%,transparent 58%);background-size:300% 100%;background-position:var(--gp,130%) 0;opacity:0}
.hs-wave{position:absolute;top:2%;bottom:2%;width:2.6%;margin-left:16px;border-radius:50%/8%;background:linear-gradient(90deg,rgba(160,164,167,.95),rgba(255,255,255,.7) 35%,rgba(150,154,157,.95) 60%,rgba(120,124,127,0));filter:drop-shadow(2px 2px 2px rgba(0,0,0,.4));opacity:0;transform:translateZ(1px)}
.hs-ripple{position:absolute;left:27%;top:47%;width:70px;height:70px;margin:-35px;border-radius:50%;border:2px solid rgba(255,255,255,.4);animation:rip 1.3s linear infinite;visibility:hidden}
.hs-ripple.d2{animation-delay:.65s}
@keyframes rip{from{transform:translateZ(2px) scale(.15);opacity:1}to{transform:translateZ(2px) scale(2.6);opacity:0}}
.hs-mk{position:absolute;left:27%;top:47%;width:1px;height:1px}
.hs-drops{position:absolute;inset:0;transform-style:preserve-3d}
.hs-drops span{position:absolute;width:5px;height:3px;border-radius:1px;background:#f3f2ed;animation:fall 1s cubic-bezier(.55,0,1,.6) both}
.hs-drops span:nth-child(3n){background:#17181a}.hs-drops span:nth-child(4n){background:#7b7e81;width:4px}
@keyframes fall{from{transform:translateZ(300px) rotate(0);opacity:0}12%{opacity:1}to{transform:translateZ(1px) rotate(220deg);opacity:1}}
.hs-sq{--sql:calc(var(--sd) * .96);position:absolute;top:2%;width:18px;height:96%;transform-style:preserve-3d;opacity:0}
.sq-f{position:absolute}
.sq-top{inset:0;transform:translateZ(26px);background:linear-gradient(90deg,#8d6a35,#f2e0b4 45%,#a47c40)}
.sq-lf{left:0;top:0;width:var(--sql);height:26px;transform-origin:0 0;transform:rotateZ(90deg) rotateX(90deg);background:linear-gradient(180deg,#0d0e0f 0 46%,#2b2d2f 46% 50%,#b48e52 50%,#f2e2bb 74%,#8f6c35);filter:brightness(.75)}
.sq-fr{left:0;bottom:0;width:100%;height:26px;transform-origin:50% 100%;transform:rotateX(-90deg);background:linear-gradient(0deg,#0d0e0f 0 46%,#b48e52 50%,#f2e2bb 74%,#8f6c35)}
.sq-pole{position:absolute;left:5px;top:calc(50% - 460px);width:9px;height:460px;background-size:100% 100%;transform-origin:50% 100%;transform:translateZ(26px) rotateY(-42deg) rotateX(-90deg)}
.hs-bucket{position:absolute;left:0;top:0;width:340px;height:340px;max-width:none;pointer-events:none;filter:drop-shadow(0 24px 30px rgba(0,0,0,.55));opacity:0}
.hs-stream{position:absolute;width:0;pointer-events:none;opacity:0}
.hs-stream i{position:absolute;left:calc(var(--sw,8px) / -2);top:0;bottom:-2px;width:var(--sw,8px);border-radius:0 0 50% 50%/0 0 10px 10px;background:linear-gradient(90deg,#7f8386,#c9cdcf 32%,#fff 44%,#b2b6b8 62%,#787c7f);box-shadow:0 0 10px rgba(255,255,255,.18);animation:wob .32s ease-in-out infinite alternate}
@keyframes wob{to{transform:scaleX(.8) translateX(1px)}}
@media (max-width:900px){.hs{perspective-origin:50% 20%}.hs-stage{--sw:min(78vw,520px);right:auto;left:50%;margin-left:calc(var(--sw) / -2);top:calc(185px + 24vw)}.hero{padding-top:calc(185px + 66vw)}}
/* grinder */
.hs-oldp{position:absolute;inset:0;transform:translateZ(calc(var(--th) + .8px))}
.hs-old{position:absolute;inset:0;width:100%;height:100%;display:block}
.hs-gplane{position:absolute;inset:0;transform-style:preserve-3d;transform:translateZ(calc(var(--th) + 2px))}
.hs-gr{position:absolute;width:22%;aspect-ratio:1;transform-style:preserve-3d;visibility:hidden}
.g-ring{position:absolute;inset:-2%;border-radius:50%;background:radial-gradient(circle,#2a2c2f 60%,#121314 71%);transform:translateZ(calc(var(--i) * 3px));box-shadow:0 0 0 1px rgba(0,0,0,.6)}
.g-ring:first-child{inset:-5%;background:#0b0b0c}
.g-top{position:absolute;inset:0;border-radius:50%;background-size:100% 100%;transform:translateZ(24px);overflow:hidden}
.g-spin{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 70%,rgba(255,255,255,.22) 80%,transparent 90%);opacity:0}
.run .g-spin{opacity:1;animation:gspin .35s linear infinite}
@keyframes gspin{to{transform:rotate(360deg)}}
.g-mot{position:absolute;inset:30%;border-radius:50%;background:radial-gradient(circle,#c99c5a,#6d4d20);transform:translateZ(calc(26px + var(--i) * 6px))}
.g-mtop{position:absolute;inset:30%;border-radius:50%;background-size:100% 100%;transform:translateZ(62px)}
.g-pole{position:absolute;top:50%;width:7px;height:330px;margin-top:-330px;background-size:100% 100%;transform-origin:50% 100%;transform:translateZ(40px) rotateX(-128deg)}
.g-pole.a{left:34%}.g-pole.b{left:62%}
.hs-dust{position:absolute;inset:0;transform-style:preserve-3d}
.hs-dust .puff{position:absolute;width:26px;height:26px;margin:-13px;border-radius:50%;background:radial-gradient(circle,rgba(225,224,218,.55),rgba(225,224,218,0) 70%);animation:puff 1.2s ease-out forwards}
.hs-dust .chip-o{position:absolute;width:5px;height:4px;border-radius:1px;background:#9aa49d;box-shadow:0 0 0 .5px rgba(0,0,0,.3);animation:chipf .9s cubic-bezier(.2,.6,.4,1) forwards}
@keyframes puff{from{transform:translateZ(4px) scale(.4);opacity:.9}to{transform:translate(var(--dx),var(--dy)) translateZ(70px) scale(2.6);opacity:0}}
@keyframes chipf{0%{transform:translateZ(6px)}50%{transform:translate(calc(var(--dx) * .8),calc(var(--dy) * .8)) translateZ(40px) rotate(180deg)}100%{transform:translate(calc(var(--dx) * 1.4),calc(var(--dy) * 1.4)) translateZ(1px) rotate(320deg);opacity:0}}
.hs-gr{display:none!important}
.gm{position:absolute;width:1px;height:1px}
.hs-grinder{position:absolute;left:0;top:0;width:560px;height:340px;max-width:none;pointer-events:none;opacity:0;filter:drop-shadow(10px 22px 18px rgba(0,0,0,.6))}
.hs-prp{position:absolute;inset:0;transform:translateZ(calc(var(--th) + 1.1px))}
.hs-roller{position:absolute;left:0;top:0;width:560px;height:300px;max-width:none;pointer-events:none;opacity:0;filter:drop-shadow(8px 20px 16px rgba(0,0,0,.55))}
/* marquee */
.marquee{overflow:hidden;border-block:1px solid var(--line);padding-block:26px;mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)}
.mtrack{display:flex;width:max-content;gap:44px;animation:mq 42s linear infinite}
.marquee:hover .mtrack{animation-play-state:paused}
.mtrack span{font:500 clamp(1.8rem,4vw,3.4rem)/1 var(--f-d);letter-spacing:-.03em;white-space:nowrap;display:flex;align-items:center;gap:44px}
.mtrack span:nth-child(even){color:transparent;-webkit-text-stroke:1px rgba(243,242,239,.4)}
.mtrack span::after{content:"✦";font-size:.5em;color:var(--gold);-webkit-text-stroke:0}
@keyframes mq{to{transform:translateX(-50%)}}

/* statement + stats */
.statement{font:300 clamp(1.5rem,3.3vw,2.9rem)/1.22 var(--f-b);letter-spacing:-.02em;max-width:30ch;text-wrap:balance}
.statement b{font-weight:500}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:clamp(40px,6vw,72px)}
.stat{padding:26px;border-radius:var(--r);background:var(--glass);border:1px solid var(--line);display:flex;flex-direction:column;gap:12px;min-width:0}
.stat b{font:500 clamp(2.2rem,4vw,3.4rem)/1 var(--f-d);letter-spacing:-.04em}
.stat span{color:var(--muted);font-size:.92rem;line-height:1.4}
@media (max-width:860px){.stats{grid-template-columns:1fr 1fr}}

.shead{display:flex;justify-content:space-between;align-items:flex-end;gap:32px;flex-wrap:wrap;margin-bottom:clamp(36px,5vw,64px)}
.shead .stack{max-width:760px}
.shead>p{max-width:42ch}

/* spotlight cards */
.spot{position:relative;overflow:hidden;isolation:isolate}
.spot::after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;opacity:0;transition:opacity .4s;background:radial-gradient(420px circle at var(--mx,50%) var(--my,50%),rgba(228,199,146,.14),transparent 45%)}
.spot:hover::after{opacity:1}

/* bento systems */
.bento{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}
.bcard{grid-column:span 6;min-height:440px;border-radius:var(--r);border:1px solid var(--line);background:var(--bg-2);text-decoration:none;display:flex;flex-direction:column;justify-content:space-between;padding:26px;color:var(--fg)}
.bcard:nth-child(1),.bcard:nth-child(4){grid-column:span 7}
.bcard:nth-child(2),.bcard:nth-child(3){grid-column:span 5}
.bcard>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;transition:transform 1.4s cubic-bezier(.2,.8,.2,1),filter .6s;filter:saturate(.75) brightness(.8)}
.bcard::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(10,12,14,.15) 0%,rgba(10,12,14,.35) 40%,rgba(10,12,14,.94) 100%)}
.bcard:hover>img{transform:scale(1.06);filter:saturate(.9) brightness(.9)}
.btop{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:rgba(10,12,14,.5);border:1px solid var(--line-2);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font:500 .72rem/1 var(--f-m);letter-spacing:.04em;color:var(--fg);white-space:nowrap}
.arrow{width:48px;height:48px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;background:rgba(255,255,255,.1);border:1px solid var(--line-2);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:all .45s cubic-bezier(.2,.8,.2,1)}
a:hover>.btop .arrow,a:hover .arrow{background:var(--gold);color:var(--gold-ink);transform:rotate(-45deg);border-color:transparent}
.bbot{display:flex;flex-direction:column;gap:14px}
.bcode{font:600 clamp(3rem,6vw,5.4rem)/.9 var(--f-d);letter-spacing:-.05em}
.bcard p{color:rgba(243,242,239,.72);font-size:.96rem;max-width:46ch}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips .chip{white-space:normal;line-height:1.3}
@media (max-width:900px){.bcard,.bcard:nth-child(n){grid-column:span 12;min-height:380px}}

/* layers iso */
.layers{display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.05fr);gap:clamp(30px,5vw,80px);align-items:center}
@media (max-width:900px){.layers{grid-template-columns:1fr}}
.seg{display:inline-flex;flex-wrap:wrap;padding:4px;border-radius:999px;background:var(--glass);border:1px solid var(--line);align-self:flex-start;gap:2px}
.seg button{font:500 .8rem/1 var(--f-m);padding:11px 16px;border-radius:999px;border:0;background:none;color:var(--muted);cursor:pointer;transition:all .3s}
.seg button[aria-selected="true"]{background:var(--fg);color:var(--bg)}
.isobox{position:relative;border-radius:var(--r);border:1px solid var(--line);background:radial-gradient(circle at 50% 40%,rgba(228,199,146,.08),transparent 60%),var(--glass);padding:26px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:center;min-height:460px}
.legend{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.legend li{display:grid;grid-template-columns:14px minmax(0,1fr);gap:12px;align-items:start;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.03);border:1px solid var(--line);animation:fadeL .5s both;animation-delay:calc(var(--i) * 70ms)}
@keyframes fadeL{from{transform:translateX(10px)}}
.legend i{width:14px;height:14px;border-radius:4px;margin-top:3px;box-shadow:0 0 0 1px rgba(255,255,255,.2) inset}
.legend b{font-weight:500;font-size:.9rem;display:block;line-height:1.3}
.legend span{font:400 .74rem/1.4 var(--f-m);color:var(--gold)}
.isonote{grid-column:1/-1;font:400 .7rem/1.4 var(--f-m);color:var(--dim)}

/* expanding panels */
.panels{display:flex;gap:14px;height:600px}
.pan{position:relative;flex:1;min-width:0;border-radius:var(--r);overflow:hidden;text-decoration:none;color:var(--fg);border:1px solid var(--line);transition:flex .8s cubic-bezier(.2,.8,.2,1);isolation:isolate}
.panels:hover .pan{flex:.8}.panels .pan:hover{flex:1.9}
.pan img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;transition:transform 1.4s cubic-bezier(.2,.8,.2,1);filter:saturate(.75)}
.pan:hover img{transform:scale(1.05)}
.pan::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(10,12,14,.2),rgba(10,12,14,.25) 40%,rgba(10,12,14,.95))}
.pan-in{position:absolute;inset:0;padding:26px;display:flex;flex-direction:column;justify-content:space-between}
.pan-num{font:500 .74rem/1 var(--f-m);color:var(--gold);letter-spacing:.14em}
.pan h3{font-size:clamp(1.3rem,2vw,1.9rem);max-width:16ch}
.pan p{color:rgba(243,242,239,.72);font-size:.95rem;max-width:40ch}
.pan .bbot{gap:12px}
@media (max-width:900px){.panels{flex-direction:column;height:auto}.pan{min-height:380px;flex:none!important}}

/* timeline */
.tl{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:clamp(30px,6vw,96px)}
.tl-head{position:sticky;top:120px;align-self:start}
.tl-list{display:flex;flex-direction:column;gap:14px;position:relative}
.tstep{display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px;padding:26px;border-radius:var(--r);background:var(--glass);border:1px solid var(--line);transition:border-color .4s,background .4s}
.tstep:hover{border-color:rgba(228,199,146,.35);background:rgba(228,199,146,.04)}
.tnum{font:500 2.6rem/1 var(--f-d);letter-spacing:-.05em;color:transparent;-webkit-text-stroke:1px rgba(228,199,146,.7);min-width:2.2ch}
.tstep .stack{gap:10px}
.tstep p{color:var(--muted);font-size:.96rem}
@media (max-width:900px){.tl{grid-template-columns:1fr}.tl-head{position:static}}
.hsteps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.hsteps .tstep{grid-template-columns:1fr;gap:16px;padding:22px}
.hsteps .tnum{font-size:2rem}
@media (max-width:1000px){.hsteps{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.hsteps{grid-template-columns:1fr}}

/* gallery */
.mosaic{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:220px;gap:14px;grid-auto-flow:dense}
.mosaic figure:nth-child(6){grid-column:span 2}
.mosaic figure{margin:0;position:relative;border-radius:22px;overflow:hidden;cursor:zoom-in;border:1px solid var(--line);background:var(--bg-2)}
.mosaic figure:nth-child(1){grid-column:span 2;grid-row:span 2}
.mosaic figure:nth-child(4){grid-row:span 2}
.mosaic img{width:100%;height:100%;object-fit:cover;transition:transform 1.2s cubic-bezier(.2,.8,.2,1)}
.mosaic figure:hover img{transform:scale(1.05)}
.mosaic figcaption{position:absolute;inset:auto 10px 10px 10px;padding:12px 14px;border-radius:14px;background:rgba(10,12,14,.6);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);font-size:.84rem;display:flex;flex-direction:column;gap:4px;transform:translateY(6px);opacity:.92;transition:all .4s}
.mosaic figure:hover figcaption{transform:none;opacity:1}
.mosaic figcaption small{font:500 .62rem/1 var(--f-m);letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
@media (max-width:860px){.mosaic{grid-template-columns:1fr 1fr;grid-auto-rows:200px}.mosaic figure:nth-child(1),.mosaic figure:nth-child(6){grid-column:span 2}.mosaic figure:nth-child(7){display:none}}
.mason{columns:3 300px;column-gap:14px}
.mason figure{margin:0 0 14px;break-inside:avoid;position:relative;border-radius:22px;overflow:hidden;cursor:zoom-in;border:1px solid var(--line)}
.mason img{width:100%;transition:transform 1.2s cubic-bezier(.2,.8,.2,1)}
.mason figure:hover img{transform:scale(1.04)}
.mason figcaption{position:absolute;inset:auto 10px 10px 10px;padding:12px 14px;border-radius:14px;background:rgba(10,12,14,.6);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);font-size:.84rem;display:flex;flex-direction:column;gap:4px}
.mason figcaption small{font:500 .62rem/1 var(--f-m);letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.filters{display:inline-flex;flex-wrap:wrap;gap:6px;padding:5px;border-radius:999px;background:var(--glass);border:1px solid var(--line);margin-bottom:28px}
.filters button{font:500 .85rem/1 var(--f-b);padding:11px 16px;border-radius:999px;border:0;background:none;color:var(--muted);cursor:pointer;transition:all .3s}
.filters button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.lb{position:fixed;inset:0;z-index:120;background:rgba(6,7,8,.94);backdrop-filter:blur(10px);display:grid;place-items:center;padding:24px}
.lb img{max-height:84vh;max-width:min(1100px,100%);object-fit:contain;border-radius:18px}
.lb button{position:absolute;top:calc(18px + env(safe-area-inset-top,0px));right:18px;width:48px;height:48px;border-radius:50%;background:var(--glass-2);border:1px solid var(--line-2);color:#fff;font-size:20px;cursor:pointer}
.lb p{color:var(--muted);margin:14px auto 0;font-size:.9rem;text-align:center}

/* norms ribbon */
.ribbon{display:flex;flex-wrap:wrap;gap:10px}
.ribbon a{display:inline-flex;align-items:center;gap:10px;padding:14px 18px;border-radius:999px;background:var(--glass);border:1px solid var(--line);text-decoration:none;font:500 .82rem/1 var(--f-m);transition:all .3s}
.ribbon a:hover{border-color:rgba(228,199,146,.45);color:var(--gold)}
.ribbon a span{color:var(--muted);font-family:var(--f-b);font-size:.82rem}

/* CTA */
.cta-card{position:relative;border-radius:36px;overflow:hidden;padding:clamp(32px,6vw,80px);border:1px solid rgba(228,199,146,.25);background:radial-gradient(120% 120% at 100% 0%,rgba(214,171,106,.28),transparent 50%),radial-gradient(80% 100% at 0% 100%,rgba(120,140,160,.14),transparent 55%),var(--bg-2);display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,.7fr);gap:40px;align-items:center;isolation:isolate}
.cta-card::before{content:"";position:absolute;inset:0;z-index:-1;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:48px 48px;mask-image:radial-gradient(circle at 80% 30%,#000,transparent 70%);-webkit-mask-image:radial-gradient(circle at 80% 30%,#000,transparent 70%)}
.cta-logo{justify-self:end;width:min(100%,320px);filter:drop-shadow(0 30px 50px rgba(0,0,0,.55));animation:float 6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-10px) rotate(-1deg)}}
@media (max-width:860px){.cta-card{grid-template-columns:1fr}.cta-logo{justify-self:start;width:220px}}

/* subpage hero */
.phero{position:relative;margin:0 12px;border-radius:0 0 36px 36px;overflow:hidden;min-height:min(70svh,640px);display:flex;align-items:flex-end;padding:150px 0 56px;isolation:isolate}
.phero>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;filter:saturate(.75);animation:kb 18s ease-out both}
@keyframes kb{from{transform:scale(1.1)}to{transform:scale(1)}}
.phero::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(10,12,14,.9),rgba(10,12,14,.4) 60%,rgba(10,12,14,.15)),linear-gradient(0deg,rgba(10,12,14,.9),transparent 50%)}
.phero .wrap{width:100%;display:flex;flex-direction:column;gap:22px}
.phero h1{font-size:clamp(2.4rem,6vw,5.6rem);max-width:14ch}
.phero .lead{color:rgba(243,242,239,.75);max-width:52ch}
.crumbs{display:inline-flex;align-self:flex-start;gap:8px;align-items:center;padding:8px 14px;border-radius:999px;background:rgba(10,12,14,.45);border:1px solid var(--line);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);font:500 .7rem/1 var(--f-m);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.crumbs a{text-decoration:none;color:var(--fg)}
@media (max-width:760px){.phero{margin:0;border-radius:0 0 28px 28px}.phero::before{background:linear-gradient(0deg,rgba(10,12,14,.95),rgba(10,12,14,.45))}}

/* generic layout pieces */
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(30px,6vw,96px);align-items:center}
.split.rev>:first-child{order:2}
@media (max-width:900px){.split{grid-template-columns:1fr}.split.rev>:first-child{order:0}}
.photo{border-radius:var(--r);overflow:hidden;aspect-ratio:4/5;max-width:100%;border:1px solid var(--line);position:relative}
.photo img{width:100%;height:100%;object-fit:cover}
.photo .chip{position:absolute;left:16px;bottom:16px}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:var(--r);padding:clamp(22px,3vw,36px)}
.specgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.spec{padding:18px;border-radius:18px;background:rgba(255,255,255,.035);border:1px solid var(--line);display:flex;flex-direction:column;gap:10px;min-width:0}
.spec small{font:500 .66rem/1.3 var(--f-m);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.spec b{font:500 1.02rem/1.25 var(--f-d);letter-spacing:-.02em;overflow-wrap:anywhere}
@media (max-width:480px){.specgrid{grid-template-columns:1fr}}
.checks{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.checks li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:14px;align-items:center;padding:14px 16px;border-radius:16px;background:var(--glass);border:1px solid var(--line);font-size:.98rem}
.checks li::before{content:"";width:28px;height:28px;border-radius:50%;background:var(--grad);box-shadow:inset 0 0 0 1px rgba(255,255,255,.3)}
.checks li{position:relative}
.checks li::after{content:"";position:absolute;left:25px;top:50%;width:8px;height:5px;border-left:2px solid var(--gold-ink);border-bottom:2px solid var(--gold-ink);transform:translateY(-70%) rotate(-45deg)}
.cards3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.cards3>div{padding:28px;border-radius:var(--r);background:var(--glass);border:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.cards3>div p{color:var(--muted);font-size:.96rem}
.cards3 .ico{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:rgba(228,199,146,.1);border:1px solid rgba(228,199,146,.25);color:var(--gold);font:600 .9rem/1 var(--f-m)}
@media (max-width:860px){.cards3{grid-template-columns:1fr}}
.mini{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.mini a{display:flex;flex-direction:column;gap:18px;padding:26px;border-radius:var(--r);background:var(--glass);border:1px solid var(--line);text-decoration:none;transition:border-color .3s}
.mini a:hover{border-color:rgba(228,199,146,.4)}
.mini .bcode{font-size:2.8rem}
.mini p{color:var(--muted);font-size:.93rem}
@media (max-width:860px){.mini{grid-template-columns:1fr}}
.recs{display:flex;flex-direction:column;gap:10px}
.recs a{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:20px;align-items:center;padding:20px 20px 20px 26px;border-radius:22px;background:var(--glass);border:1px solid var(--line);text-decoration:none;transition:border-color .3s}
.recs a:hover{border-color:rgba(228,199,146,.4)}
.recs .code{font:600 1.7rem/1 var(--f-d);letter-spacing:-.04em}
.recs span{color:var(--muted);font-size:.88rem}

/* table */
.tablecard{border-radius:var(--r);border:1px solid var(--line);background:var(--glass);overflow-x:auto}
.cmp{width:100%;min-width:760px;border-collapse:collapse}
.cmp th,.cmp td{padding:18px 22px;text-align:left;border-bottom:1px solid var(--line);font-size:.92rem}
.cmp thead th{font:600 1.15rem/1 var(--f-d);letter-spacing:-.03em}
.cmp tbody th{font:500 .72rem/1.3 var(--f-m);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
.cmp td{font-family:var(--f-m);font-size:.84rem}
.cmp tbody tr:last-child>*{border-bottom:0}
.cmp tbody tr:hover{background:rgba(255,255,255,.025)}

/* norms */
.norms{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.norm{padding:28px;border-radius:var(--r);background:var(--glass);border:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.norm code{align-self:flex-start;padding:7px 12px;border-radius:999px;background:rgba(228,199,146,.1);border:1px solid rgba(228,199,146,.3);color:var(--gold);font:500 .78rem/1 var(--f-m)}
.norm p{color:var(--muted);font-size:.95rem}
@media (max-width:860px){.norms{grid-template-columns:1fr}}
.rscale{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.rs{padding:22px 18px;border-radius:22px;border:1px solid var(--line);display:flex;flex-direction:column;gap:14px;background:var(--glass);position:relative;overflow:hidden}
.rs b{font:600 2rem/1 var(--f-d);letter-spacing:-.04em}
.rs .meter{height:6px;border-radius:6px;background:var(--line);overflow:hidden}
.rs .meter i{display:block;height:100%;background:var(--grad)}
.rs p{color:var(--muted);font-size:.88rem;line-height:1.45}
@media (max-width:900px){.rscale{grid-template-columns:1fr 1fr}}
@media (max-width:480px){.rscale{grid-template-columns:1fr}}

/* faq */
.faq{display:flex;flex-direction:column;gap:10px;max-width:920px}
.faq details{border-radius:22px;background:var(--glass);border:1px solid var(--line);transition:border-color .3s,background .3s}
.faq details[open]{border-color:rgba(228,199,146,.3);background:rgba(228,199,146,.035)}
.faq summary{cursor:pointer;list-style:none;padding:24px 26px;display:flex;justify-content:space-between;align-items:center;gap:20px;font:500 clamp(1rem,1.5vw,1.15rem)/1.35 var(--f-d);letter-spacing:-.02em}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";flex-shrink:0;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--glass-2);font:300 1.3rem/1 var(--f-b);color:var(--gold);transition:transform .35s}
.faq details[open] summary::after{transform:rotate(45deg)}
.faq details p{padding:0 26px 26px;color:var(--muted)}

/* form */
.form{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.form .full{grid-column:1/-1}
.form label{display:flex;flex-direction:column;gap:9px;font:500 .7rem/1 var(--f-m);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);min-width:0}
.form input,.form select,.form textarea{font:400 1rem/1.4 var(--f-b);color:var(--fg);background:rgba(255,255,255,.04);border:1px solid var(--line);padding:16px 18px;border-radius:16px;width:100%;letter-spacing:0;text-transform:none;transition:border-color .25s,box-shadow .25s,background .25s}

/* reveal on scroll (blur + 3D) */

.kt.armed.in .sc{transform:none;opacity:1;transition:transform 1s cubic-bezier(.16,1,.3,1) calc(var(--i) * var(--st,55ms)),opacity .6s ease calc(var(--i) * var(--st,55ms))}

.map-facts>div,.cards3>div{position:relative;overflow:hidden}

.beams i:nth-child(1){left:36%;transform:rotate(9deg);animation-duration:13s}

 .tl-list .tstep::before{content:"";position:absolute;left:-32px;top:34px;width:14px;height:14px;border-radius:50%;background:var(--bg);border:2px solid var(--line-2);transition:all .4s}

#confetti{position:fixed;inset:0;width:100vw;height:100vh;z-index:130;pointer-events:none}
.shake{animation:shake .52s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{10%,90%{transform:translate3d(-2px,1px,0)}20%,80%{transform:translate3d(4px,-2px,0)}30%,50%,70%{transform:translate3d(-7px,3px,0)}40%,60%{transform:translate3d(7px,-3px,0)}}
.victory{position:fixed;inset:0;z-index:125;display:grid;place-items:center;padding:20px;background:rgba(6,7,8,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);animation:vIn .35s ease both}
.victory.out{animation:vOut .4s ease both}
@keyframes vIn{from{opacity:0}}@keyframes vOut{to{opacity:0}}
.v-card{width:min(440px,100%);padding:30px 28px 26px;border-radius:30px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;background:radial-gradient(120% 90% at 50% 0%,rgba(214,171,106,.22),transparent 60%),var(--bg-2);border:1px solid rgba(228,199,146,.35);box-shadow:0 50px 120px -30px rgba(0,0,0,.9)}
.v-card .kicker{align-self:center}
.v-card h3{font-size:1.4rem}
.v-stage{position:relative;width:120px;height:120px;display:grid;place-items:center}
.v-stamp{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;background:var(--grad);color:var(--gold-ink);box-shadow:0 0 0 8px rgba(228,199,146,.15),0 20px 50px rgba(214,171,106,.5);animation:stamp .6s cubic-bezier(.5,0,.6,1.4) both}
@keyframes stamp{0%{transform:scale(3.2) rotate(-25deg);opacity:0}70%{transform:scale(.92) rotate(3deg);opacity:1}100%{transform:none}}
.v-wave{position:absolute;inset:0;border-radius:50%;border:2px solid var(--gold);opacity:0;animation:wave 1.1s .5s ease-out both}
.v-wave.w2{animation-delay:.68s}
@keyframes wave{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2.6);opacity:0}}
/* particle intro */
#intro{position:fixed;inset:0;z-index:200;background:radial-gradient(60% 50% at 50% 46%,#16191c,#08090a);display:grid;place-items:center;cursor:pointer}
#intro canvas{position:absolute;inset:0;width:100%;height:100%}
#intro .intro-sub{position:absolute;left:0;right:0;bottom:22%;text-align:center;font-size:.72rem;letter-spacing:.32em;color:var(--muted);animation:subIn 1s 1.2s ease both}
@keyframes subIn{from{opacity:0;letter-spacing:.6em}}
.intro-skip{position:absolute;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));padding:10px 16px;border-radius:999px;border:1px solid var(--line-2);background:rgba(255,255,255,.06);color:var(--muted);font:500 .74rem/1 var(--f-m);letter-spacing:.1em;cursor:pointer}
#intro.out{animation:introOut .75s cubic-bezier(.7,0,.3,1) forwards}
@keyframes introOut{to{opacity:0;clip-path:inset(0 0 100% 0)}}
/* zoom lens */
.lens{position:fixed;width:190px;height:190px;margin:-95px 0 0 -95px;border-radius:50%;pointer-events:none;z-index:125;background-repeat:no-repeat;border:2px solid rgba(228,199,146,.8);box-shadow:0 20px 50px rgba(0,0,0,.6),inset 0 0 0 4px rgba(10,12,14,.5)}
#lb-img{cursor:crosshair}
/* footer: smoke + text fill */
.ftr{position:relative;isolation:isolate}
#ftr-smoke{position:absolute;inset:0;width:100%;height:100%;z-index:-1;opacity:.85;pointer-events:none}
.giant{font-size:clamp(2.2rem,8.6vw,10rem)!important;letter-spacing:-.05em;background:linear-gradient(100deg,#f4e2bb 0%,#d6ab6a calc(var(--fill,0%) - 8%),#9b733a var(--fill,0%),rgba(243,242,239,.08) calc(var(--fill,0%) + .5%),rgba(243,242,239,.05) 100%)!important;-webkit-background-clip:text!important;background-clip:text!important;color:transparent;-webkit-text-stroke:1px rgba(243,242,239,.12);transform:translateY(8%)!important;padding-bottom:.08em}
/* view transitions between pages */
::view-transition-old(root){animation:vtOld .5s cubic-bezier(.7,0,.3,1) both}
::view-transition-new(root){animation:vtNew .75s cubic-bezier(.7,0,.3,1) both}
@keyframes vtOld{to{opacity:0;transform:scale(.965) translateY(-20px);filter:blur(8px)}}
@keyframes vtNew{from{clip-path:inset(100% 0 0 0 round 40px);transform:translateY(60px)}to{clip-path:inset(0 0 0 0 round 0);transform:none}}
@media (prefers-reduced-motion:reduce){.rv.armed,.kt.armed .sc{opacity:1!important;transform:none!important;filter:none!important}.beams{display:none}}
